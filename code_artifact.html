<!DOCTYPE html>

            font-family: 'Noto Sans TC', sans-serif;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }
        .canvas-container {
            cursor: grab;
        }
        .canvas-container:active {
            cursor: grabbing;
        }

        }

            -ms-overflow-style: none;
            scrollbar-width: none;

</head>
<body class="bg-slate-950 text-slate-100 h-screen w-screen overflow-hidden flex flex-col relative" id="appBody">

        <!-- 讀取 dory 資料夾核心按鈕 -->

            <button id="btnLoadFolder" class="bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white px-3.5 py-1.5 rounded-xl text-xs sm:text-sm font-semibold transition flex items-center space-x-2 shadow-lg shadow-indigo-500/25 active:scale-95">

            <input type="file" id="folderInputFallback" webkitdirectory directory multiple class="hidden">

            <button id="btnPrevImg" class="bg-slate-800 hover:bg-slate-700 text-slate-300 p-2 rounded-xl text-xs transition disabled:opacity-30" disabled title="上一張圖片">

            <button id="btnNextImg" class="bg-slate-800 hover:bg-slate-700 text-slate-300 p-2 rounded-xl text-xs transition disabled:opacity-30" disabled title="下一張圖片">

    <!-- Canvas 主繪圖區域 -->

        <!-- 拼圖 Canvas -->

        <!-- 雙擊放大鏡面板 -->

            <div class="text-[11px] text-indigo-300 font-bold flex items-center space-x-1">
                <i class="fa-solid fa-magnifying-glass"></i>

            </div>
            <canvas id="magnifierCanvas" class="rounded-xl border border-slate-700 shadow-inner" width="160" height="160"></canvas>

        <!-- 畫布平移縮放控制項 -->
        <div class="absolute bottom-4 left-4 z-20 flex items-center bg-slate-900/90 backdrop-blur border border-slate-800 rounded-xl p-1.5 shadow-xl space-x-1">
            <button id="btnZoomIn" class="p-2 hover:bg-slate-800 rounded-lg text-slate-300 hover:text-white transition" title="放大">
                <i class="fa-solid fa-magnifying-glass-plus"></i>
            </button>
            <button id="btnZoomReset" class="px-2 py-1 hover:bg-slate-800 rounded-lg text-slate-300 hover:text-white text-xs font-mono font-bold transition" id="zoomText">
                100%
            </button>
            <button id="btnZoomOut" class="p-2 hover:bg-slate-800 rounded-lg text-slate-300 hover:text-white transition" title="縮小">
                <i class="fa-solid fa-magnifying-glass-minus"></i>
            </button>
            <div class="h-4 w-px bg-slate-800 my-auto"></div>
            <button id="btnScatter" class="p-2 hover:bg-slate-800 rounded-lg text-amber-400 hover:text-amber-300 transition" title="分散剩餘拼片">
                <i class="fa-solid fa-shuffle"></i>

        <!-- 底圖透明度調節控制器 -->

            <span class="text-slate-400 font-medium">底圖透明度</span>

        <!-- 拖拽圖片 / 資料夾提示罩 -->

    <!-- 拼圖設定面板 Modal -->

                    <button class="piece-option-btn p-2 rounded-xl border border-slate-800 bg-slate-950 hover:border-indigo-500 text-center transition" data-pieces="48">
                        <div class="text-base font-bold text-white">48</div>
                        <div class="text-[9px] text-slate-400">大塊</div>
                    </button>
                    <button class="piece-option-btn active-piece-btn p-2 rounded-xl border-2 border-indigo-500 bg-indigo-950/50 text-center transition" data-pieces="100">
                        <div class="text-base font-bold text-indigo-300">100</div>
                        <div class="text-[9px] text-indigo-400">推薦</div>
                    </button>
                    <button class="piece-option-btn p-2 rounded-xl border border-slate-800 bg-slate-950 hover:border-indigo-500 text-center transition" data-pieces="200">
                        <div class="text-base font-bold text-white">200</div>
                        <div class="text-[9px] text-slate-400">適中</div>
                    </button>
                    <button class="piece-option-btn p-2 rounded-xl border border-slate-800 bg-slate-950 hover:border-indigo-500 text-center transition" data-pieces="500">
                        <div class="text-base font-bold text-amber-300">500</div>
                        <div class="text-[9px] text-amber-400">微縮</div>
                    </button>
                    <button class="piece-option-btn p-2 rounded-xl border border-slate-800 bg-slate-950 hover:border-indigo-500 text-center transition" data-pieces="800">
                        <div class="text-base font-bold text-rose-300">800</div>
                        <div class="text-[9px] text-rose-400">高難</div>
                    </button>
                    <button class="piece-option-btn p-2 rounded-xl border border-slate-800 bg-slate-950 hover:border-indigo-500 text-center transition" data-pieces="1000">
                        <div class="text-base font-bold text-purple-300">1000</div>
                        <div class="text-[9px] text-purple-400">大師</div>
                    </button>
                </div>
                <p id="gridInfoText" class="text-xs text-indigo-300 text-right mt-1 font-mono">預計網格：12 x 8 格 (96 片)</p>
            </div>

            <!-- 開始按鈕 -->
            <button id="btnStartGame" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 px-6 rounded-xl shadow-lg shadow-indigo-600/30 transition active:scale-98 flex items-center justify-center space-x-2 text-sm">
                <i class="fa-solid fa-play"></i>

            </button>
        </div>
    </div>

    <!-- JavaScript 遊戲核心與資料夾載入邏輯 -->
    <script>
        class SoundEffects {
            constructor() { this.ctx = null; }
            init() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); }
            playSnap() {
                this.init();
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(320, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(850, this.ctx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(); osc.stop(this.ctx.currentTime + 0.08);
            }
            playVictory() {
                this.init();
                if (!this.ctx) return;
                [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle'; osc.frequency.value = freq;
                    const st = this.ctx.currentTime + idx * 0.12;
                    gain.gain.setValueAtTime(0.2, st);
                    gain.gain.exponentialRampToValueAtTime(0.001, st + 0.4);
                    osc.connect(gain); gain.connect(this.ctx.destination);
                    osc.start(st); osc.stop(st + 0.4);
                });
            }
        }

        const soundFX = new SoundEffects();

        // 預設 SVG Dory 圖像樣板
        const DEFAULT_SVG_DORY = `data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><rect width="1200" height="800" fill="%230f172a"/><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="%231e1b4b"/><stop offset="100%" stop-color="%23311b92"/></linearGradient></defs><rect width="1200" height="800" fill="url(%23g)"/><circle cx="600" cy="400" r="300" fill="%232563eb" opacity="0.8"/><ellipse cx="550" cy="400" rx="220" ry="140" fill="%233b82f6"/><path d="M 750,400 L 920,300 L 920,500 Z" fill="%23facc15"/><circle cx="430" cy="360" r="28" fill="%23ffffff"/><circle cx="430" cy="360" r="14" fill="%23000000"/><path d="M 400,430 Q 500,480 600,420" stroke="%23ffffff" stroke-width="8" fill="none" stroke-linecap="round"/><text x="600" y="720" font-family="sans-serif" font-size="32" font-weight="bold" fill="%23818cf8" text-anchor="middle">請點擊上方的 [📂 載入 dory 資料夾] 按鈕匯入圖片</text></svg>`;

        let loadedImages = []; // { name, url }
        let currentImageIndex = 0;
        let currentImage = new Image();

        const canvas = document.getElementById('puzzleCanvas');
        const ctx = canvas.getContext('2d');

        let selectedPieceCount = 100;
        let cols = 12;
        let rows = 8;

        let pieces = [];
        let groups = [];
        let boardBounds = { x: 0, y: 0, w: 0, h: 0 };

        let scale = 1.0;
        let panX = 0;
        let panY = 0;
        let isDraggingCanvas = false;
        let lastMouseX = 0;
        let lastMouseY = 0;

        let draggedGroup = null;
        let dragOffsetX = 0;
        let dragOffsetY = 0;

        let timerInterval = null;
        let secondsElapsed = 0;
        let isCompleted = false;
        let showEdgeOnly = false;

        let horizontalTabs = [];
        let verticalTabs = [];
        let lastClickTime = 0;

        // 自動載入/讀取 dory 資料夾
        async function loadDoryFolder() {
            try {
                if ('showDirectoryPicker' in window) {
                    const dirHandle = await window.showDirectoryPicker();
                    const files = [];
                    for await (const entry of dirHandle.values()) {
                        if (entry.kind === 'file') {
                            const file = await entry.getFile();
                            if (file.type.startsWith('image/') || /\.(jpg|jpeg|png|webp|gif)$/i.test(file.name)) {
                                files.push(file);
                            }
                        }
                    }
                    if (files.length > 0) {
                        processFileList(files);
                        return;
                    }
                }
            } catch (err) {
                console.log("Directory Picker fallback", err);
            }
            // 回退觸發傳統 input file directory
            document.getElementById('folderInputFallback').click();
        }

        function processFileList(files) {
            const validImages = Array.from(files).filter(f => 
                f.type.startsWith('image/') || /\.(jpg|jpeg|png|webp|gif)$/i.test(f.name)
            );

            if (validImages.length === 0) {
                alert("所選資料夾中未找到可用的 JPG, PNG, WEBP 圖像！");
                return;
            }

            // 清理舊的 Blob URLs
            loadedImages.forEach(img => URL.revokeObjectURL(img.url));
            loadedImages = validImages.map(file => ({
                name: file.name,
                url: URL.createObjectURL(file)
            }));

            currentImageIndex = 0;
            renderGalleryDrawer();
            switchImage(0);
        }

        function renderGalleryDrawer() {
            const drawer = document.getElementById('galleryBar');
            const thumbsContainer = document.getElementById('galleryThumbnails');
            const countText = document.getElementById('galleryCount');

            drawer.classList.remove('hidden');
            countText.innerText = loadedImages.length;
            thumbsContainer.innerHTML = '';

            loadedImages.forEach((item, idx) => {
                const thumb = document.createElement('div');
                thumb.className = `w-12 h-12 rounded-lg overflow-hidden border-2 cursor-pointer shrink-0 transition ${idx === currentImageIndex ? 'border-indigo-500 scale-105 shadow-md shadow-indigo-500/30' : 'border-slate-800 opacity-60 hover:opacity-100'}`;
                thumb.innerHTML = `<img src="${item.url}" class="w-full h-full object-cover" title="${item.name}">`;
                thumb.addEventListener('click', () => switchImage(idx));
                thumbsContainer.appendChild(thumb);
            });

            document.getElementById('btnPrevImg').disabled = loadedImages.length <= 1;
            document.getElementById('btnNextImg').disabled = loadedImages.length <= 1;
        }

        function switchImage(index) {
            if (loadedImages.length === 0) return;
            currentImageIndex = (index + loadedImages.length) % loadedImages.length;
            const target = loadedImages[currentImageIndex];

            document.getElementById('currentImgName').innerText = target.name;
            renderGalleryDrawer();

            currentImage = new Image();
            currentImage.crossOrigin = "Anonymous";
            currentImage.onload = () => { setupGame(); };
            currentImage.src = target.url;
        }

        function calculateGrid(imgWidth, imgHeight, targetCount) {
            const aspect = imgWidth / imgHeight;
            let bestCols = Math.round(Math.sqrt(targetCount * aspect));
            let bestRows = Math.round(targetCount / bestCols);
            bestCols = Math.max(2, bestCols);
            bestRows = Math.max(2, bestRows);
            return { cols: bestCols, rows: bestRows, actualCount: bestCols * bestRows };
        }

        function generateTabs(cols, rows) {
            horizontalTabs = [];
            verticalTabs = [];
            for (let r = 0; r < rows; r++) {
                horizontalTabs[r] = [];
                for (let c = 0; c < cols - 1; c++) {
                    horizontalTabs[r][c] = Math.random() < 0.5 ? 1 : -1;
                }
            }
            for (let r = 0; r < rows - 1; r++) {
                verticalTabs[r] = [];
                for (let c = 0; c < cols; c++) {
                    verticalTabs[r][c] = Math.random() < 0.5 ? 1 : -1;
                }
            }
        }

        function createPuzzlePieces() {
            pieces = [];
            groups = [];

            const pieceW = boardBounds.w / cols;
            const pieceH = boardBounds.h / rows;

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const targetX = boardBounds.x + c * pieceW;
                    const targetY = boardBounds.y + r * pieceH;

                    const topTab = (r === 0) ? 0 : -verticalTabs[r - 1][c];
                    const rightTab = (c === cols - 1) ? 0 : horizontalTabs[r][c];
                    const bottomTab = (r === rows - 1) ? 0 : verticalTabs[r][c];
                    const leftTab = (c === 0) ? 0 : -horizontalTabs[r][c - 1];

                    const isEdge = (r === 0 || r === rows - 1 || c === 0 || c === cols - 1);

                    let randomX, randomY;
                    if (Math.random() < 0.5) {
                        randomX = Math.random() < 0.5 
                            ? boardBounds.x - pieceW * 2 - Math.random() * 250 
                            : boardBounds.x + boardBounds.w + pieceW + Math.random() * 250;
                        randomY = boardBounds.y + Math.random() * (boardBounds.h - pieceH);
                    } else {
                        randomX = boardBounds.x + Math.random() * (boardBounds.w - pieceW);
                        randomY = Math.random() < 0.5 
                            ? boardBounds.y - pieceH * 2 - Math.random() * 150 
                            : boardBounds.y + boardBounds.h + pieceH + Math.random() * 200;
                    }

                    const piece = {
                        id: r * cols + c,
                        row: r, col: c,
                        x: randomX, y: randomY,
                        targetX: targetX, targetY: targetY,
                        width: pieceW, height: pieceH,
                        tabs: { top: topTab, right: rightTab, bottom: bottomTab, left: leftTab },
                        isEdge: isEdge,
                        isLocked: false
                    };

                    pieces.push(piece);
                    groups.push({ id: piece.id, pieces: [piece] });
                }
            }
        }

        function drawPiecePath(ctx, x, y, w, h, tabs) {
            const tabSize = Math.min(w, h) * 0.22;
            ctx.beginPath();
            ctx.moveTo(x, y);

            // Top
            if (tabs.top === 0) ctx.lineTo(x + w, y);
            else {
                const dir = tabs.top;
                ctx.lineTo(x + w * 0.35, y);
                ctx.bezierCurveTo(x + w * 0.35, y - tabSize * dir, x + w * 0.4, y - tabSize * dir * 1.25, x + w * 0.5, y - tabSize * dir * 1.25);
                ctx.bezierCurveTo(x + w * 0.6, y - tabSize * dir * 1.25, x + w * 0.65, y - tabSize * dir, x + w * 0.65, y);
                ctx.lineTo(x + w, y);
            }

            // Right
            if (tabs.right === 0) ctx.lineTo(x + w, y + h);
            else {
                const dir = tabs.right;
                ctx.lineTo(x + w, y + h * 0.35);
                ctx.bezierCurveTo(x + w + tabSize * dir, y + h * 0.35, x + w + tabSize * dir * 1.25, y + h * 0.4, x + w + tabSize * dir * 1.25, y + h * 0.5);
                ctx.bezierCurveTo(x + w + tabSize * dir * 1.25, y + h * 0.6, x + w + tabSize * dir, y + h * 0.65, x + w, y + h * 0.65);
                ctx.lineTo(x + w, y + h);
            }

            // Bottom
            if (tabs.bottom === 0) ctx.lineTo(x, y + h);
            else {
                const dir = tabs.bottom;
                ctx.lineTo(x + w * 0.65, y + h);
                ctx.bezierCurveTo(x + w * 0.65, y + h + tabSize * dir, x + w * 0.6, y + h + tabSize * dir * 1.25, x + w * 0.5, y + h + tabSize * dir * 1.25);
                ctx.bezierCurveTo(x + w * 0.4, y + h + tabSize * dir * 1.25, x + w * 0.35, y + h + tabSize * dir, x + w * 0.35, y + h);
                ctx.lineTo(x, y + h);
            }

            // Left
            if (tabs.left === 0) ctx.lineTo(x, y);
            else {
                const dir = tabs.left;
                ctx.lineTo(x, y + h * 0.65);
                ctx.bezierCurveTo(x - tabSize * dir, y + h * 0.65, x - tabSize * dir * 1.25, y + h * 0.6, x - tabSize * dir * 1.25, y + h * 0.5);
                ctx.bezierCurveTo(x - tabSize * dir * 1.25, y + h * 0.4, x - tabSize * dir, y + h * 0.35, x, y + h * 0.35);
                ctx.lineTo(x, y);
            }
            ctx.closePath();
        }

        function render() {
            ctx.save();
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.translate(panX, panY);
            ctx.scale(scale, scale);

            // 1. 底板外框與底色
            ctx.fillStyle = 'rgba(15, 23, 42, 0.75)';
            ctx.strokeStyle = 'rgba(99, 102, 241, 0.5)';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.roundRect(boardBounds.x - 12, boardBounds.y - 12, boardBounds.w + 24, boardBounds.h + 24, 20);
            ctx.fill();
            ctx.stroke();

            // 對齊線
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
            ctx.lineWidth = 1;
            const pW = boardBounds.w / cols;
            const pH = boardBounds.h / rows;
            for (let c = 1; c < cols; c++) {
                ctx.beginPath();
                ctx.moveTo(boardBounds.x + c * pW, boardBounds.y);
                ctx.lineTo(boardBounds.x + c * pW, boardBounds.y + boardBounds.h);
                ctx.stroke();
            }
            for (let r = 1; r < rows; r++) {
                ctx.beginPath();
                ctx.moveTo(boardBounds.x, boardBounds.y + r * pH);
                ctx.lineTo(boardBounds.x + boardBounds.w, boardBounds.y + r * pH);
                ctx.stroke();
            }

            // 2. 繪製拼圖群組
            groups.forEach(group => {
                if (group !== draggedGroup) renderGroup(group);
            });

            if (draggedGroup) {
                renderGroup(draggedGroup, true);
            }

            ctx.restore();
            requestAnimationFrame(render);
        }

        function renderGroup(group, isDragging = false) {
            group.pieces.forEach(p => {
                if (showEdgeOnly && !p.isEdge && !p.isLocked) {
                    ctx.globalAlpha = 0.12;
                } else {
                    ctx.globalAlpha = 1.0;
                }

                ctx.save();
                drawPiecePath(ctx, p.x, p.y, p.width, p.height, p.tabs);

                if (isDragging) {
                    ctx.shadowColor = 'rgba(0, 0, 0, 0.6)';
                    ctx.shadowBlur = 18;
                    ctx.shadowOffsetY = 10;
                } else if (!p.isLocked) {
                    ctx.shadowColor = 'rgba(0, 0, 0, 0.35)';
                    ctx.shadowBlur = 6;
                    ctx.shadowOffsetY = 3;
                }

                ctx.save();
                ctx.clip();

                // 精確 1:1 比率圖像裁切 (Mapping Source coordinates)
                const tabPadding = Math.min(p.width, p.height) * 0.35;
                const renderDx = p.x - tabPadding;
                const renderDy = p.y - tabPadding;

                const scaleX = currentImage.width / boardBounds.w;
                const scaleY = currentImage.height / boardBounds.h;

                const renderSx = (p.col * p.width - tabPadding) * scaleX;
                const renderSy = (p.row * p.height - tabPadding) * scaleY;
                const renderSw = (p.width + tabPadding * 2) * scaleX;
                const renderSh = (p.height + tabPadding * 2) * scaleY;

                const safeSx = Math.max(0, renderSx);
                const safeSy = Math.max(0, renderSy);
                const safeSw = Math.min(currentImage.width - safeSx, renderSw - (safeSx - renderSx));
                const safeSh = Math.min(currentImage.height - safeSy, renderSh - (safeSy - renderSy));

                const adjustedDx = renderDx + (safeSx - renderSx) / scaleX;
                const adjustedDy = renderDy + (safeSy - renderSy) / scaleY;
                const adjustedDw = safeSw / scaleX;
                const adjustedDh = safeSh / scaleY;

                ctx.drawImage(
                    currentImage,
                    safeSx, safeSy, safeSw, safeSh,
                    adjustedDx, adjustedDy, adjustedDw, adjustedDh
                );

                ctx.restore();

                ctx.strokeStyle = p.isLocked 
                    ? 'rgba(255, 255, 255, 0.25)' 
                    : (isDragging ? 'rgba(129, 140, 248, 0.95)' : 'rgba(255, 255, 255, 0.45)');
                ctx.lineWidth = isDragging ? 3 : 1.8;
                ctx.stroke();

                ctx.restore();
            });
        }

        function getMousePos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: (clientX - rect.left - panX) / scale,
                y: (clientY - rect.top - panY) / scale
            };
        }

        function findPieceAt(pos) {
            for (let i = groups.length - 1; i >= 0; i--) {
                const group = groups[i];
                for (const p of group.pieces) {
                    if (pos.x >= p.x && pos.x <= p.x + p.width &&
                        pos.y >= p.y && pos.y <= p.y + p.height) {
                        return { piece: p, group: group };
                    }
                }
            }
            return null;
        }

        function showPieceMagnifier(piece) {
            const modal = document.getElementById('magnifierModal');
            const magCanvas = document.getElementById('magnifierCanvas');
            const mctx = magCanvas.getContext('2d');

            mctx.clearRect(0, 0, magCanvas.width, magCanvas.height);

            const srcX = (piece.col / cols) * currentImage.width;
            const srcY = (piece.row / rows) * currentImage.height;
            const srcW = currentImage.width / cols;
            const srcH = currentImage.height / rows;

            mctx.drawImage(currentImage, srcX, srcY, srcW, srcH, 0, 0, magCanvas.width, magCanvas.height);
            modal.classList.remove('hidden');

            setTimeout(() => { modal.classList.add('hidden'); }, 2200);
        }

        function handlePointerDown(e) {
            if (isCompleted) return;

            const now = Date.now();
            const pos = getMousePos(e);
            const found = findPieceAt(pos);

            if (now - lastClickTime < 300 && found) {
                showPieceMagnifier(found.piece);
            }
            lastClickTime = now;

            if (found && !found.piece.isLocked) {
                draggedGroup = found.group;
                dragOffsetX = pos.x;
                dragOffsetY = pos.y;

                const idx = groups.indexOf(draggedGroup);
                if (idx > -1) {
                    groups.splice(idx, 1);
                    groups.push(draggedGroup);
                }
            } else {
                isDraggingCanvas = true;
                lastMouseX = e.touches ? e.touches[0].clientX : e.clientX;
                lastMouseY = e.touches ? e.touches[0].clientY : e.clientY;
            }
        }

        function handlePointerMove(e) {
            if (draggedGroup) {
                const pos = getMousePos(e);
                const dx = pos.x - dragOffsetX;
                const dy = pos.y - dragOffsetY;

                draggedGroup.pieces.forEach(p => {
                    p.x += dx;
                    p.y += dy;
                });

                dragOffsetX = pos.x;
                dragOffsetY = pos.y;
            } else if (isDraggingCanvas) {
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;

                panX += clientX - lastMouseX;
                panY += clientY - lastMouseY;

                lastMouseX = clientX;
                lastMouseY = clientY;
            }
        }

        function handlePointerUp() {
            if (draggedGroup) {
                checkSnap(draggedGroup);
                draggedGroup = null;
            }
            isDraggingCanvas = false;
        }

        function checkSnap(group) {
            const snapThreshold = Math.min(boardBounds.w / cols, boardBounds.h / rows) * 0.4;
            let snapped = false;

            // 1. 吸附底圖正確位置
            for (const p of group.pieces) {
                const distToTarget = Math.hypot(p.x - p.targetX, p.y - p.targetY);

                if (distToTarget < snapThreshold) {
                    const correctionX = p.targetX - p.x;
                    const correctionY = p.targetY - p.y;

                    group.pieces.forEach(piece => {
                        piece.x += correctionX;
                        piece.y += correctionY;
                        piece.isLocked = true;
                    });

                    snapped = true;
                    soundFX.playSnap();
                    break;
                }
            }

            // 2. 吸附相鄰拼片
            if (!snapped) {
                for (const otherGroup of groups) {
                    if (otherGroup === group) continue;

                    let shouldMerge = false;
                    let mergeOffsetX = 0;
                    let mergeOffsetY = 0;

                    for (const p1 of group.pieces) {
                        for (const p2 of otherGroup.pieces) {
                            const isNeighbor = Math.abs(p1.row - p2.row) + Math.abs(p1.col - p2.col) === 1;

                            if (isNeighbor) {
                                const expectedDx = p1.targetX - p2.targetX;
                                const expectedDy = p1.targetY - p2.targetY;
                                const actualDx = p1.x - p2.x;
                                const actualDy = p1.y - p2.y;

                                if (Math.hypot(actualDx - expectedDx, actualDy - expectedDy) < snapThreshold) {
                                    shouldMerge = true;
                                    mergeOffsetX = (p2.x + expectedDx) - p1.x;
                                    mergeOffsetY = (p2.y + expectedDy) - p1.y;
                                    break;
                                }
                            }
                        }
                        if (shouldMerge) break;
                    }

                    if (shouldMerge) {
                        group.pieces.forEach(p => {
                            p.x += mergeOffsetX;
                            p.y += mergeOffsetY;
                            otherGroup.pieces.push(p);
                        });

                        const groupIdx = groups.indexOf(group);
                        if (groupIdx > -1) groups.splice(groupIdx, 1);

                        soundFX.playSnap();
                        break;
                    }
                }
            }

            updateProgress();
        }

        function updateProgress() {
            const lockedCount = pieces.filter(p => p.isLocked).length;
            document.getElementById('progressText').innerText = `${lockedCount} / ${pieces.length}`;

            if (lockedCount === pieces.length && pieces.length > 0 && !isCompleted) {
                isCompleted = true;
                clearInterval(timerInterval);
                soundFX.playVictory();

                confetti({ particleCount: 200, spread: 100, origin: { y: 0.6 } });

                setTimeout(() => {
                    alert(`🎉 恭喜完成這關拼圖！\n花費時間：${formatTime(secondsElapsed)}\n挑戰片數：${pieces.length} 片`);
                }, 300);
            }
        }

        function startTimer() {
            clearInterval(timerInterval);
            secondsElapsed = 0;
            document.getElementById('timerText').innerText = "00:00";
            timerInterval = setInterval(() => {
                secondsElapsed++;
                document.getElementById('timerText').innerText = formatTime(secondsElapsed);
            }, 1000);
        }

        function formatTime(sec) {
            const m = Math.floor(sec / 60).toString().padStart(2, '0');
            const s = (sec % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        function setupGame() {
            const container = document.getElementById('workspace');
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;

            const maxW = canvas.width * 0.75;
            const maxH = canvas.height * 0.75;
            const imgAspect = (currentImage.width || 1200) / (currentImage.height || 800);

            let boardW = maxW;
            let boardH = maxW / imgAspect;

            if (boardH > maxH) {
                boardH = maxH;
                boardW = maxH * imgAspect;
            }

            boardBounds = {
                x: (canvas.width - boardW) / 2,
                y: (canvas.height - boardH) / 2,
                w: boardW,
                h: boardH
            };

            const hintImg = document.getElementById('hintImage');
            hintImg.src = currentImage.src;
            hintImg.style.width = `${boardW}px`;
            hintImg.style.height = `${boardH}px`;

            const grid = calculateGrid(currentImage.width || 1200, currentImage.height || 800, selectedPieceCount);
            cols = grid.cols;
            rows = grid.rows;

            generateTabs(cols, rows);
            createPuzzlePieces();

            isCompleted = false;
            scale = 1.0;
            panX = 0;
            panY = 0;

            updateProgress();
            startTimer();
        }

        function initUI() {
            const modal = document.getElementById('newGameModal');

            document.getElementById('btnLoadFolder').addEventListener('click', loadDoryFolder);
            document.getElementById('folderInputFallback').addEventListener('change', (e) => {
                if (e.target.files && e.target.files.length > 0) {
                    processFileList(e.target.files);
                }
            });

            document.getElementById('btnPrevImg').addEventListener('click', () => switchImage(currentImageIndex - 1));
            document.getElementById('btnNextImg').addEventListener('click', () => switchImage(currentImageIndex + 1));

            document.getElementById('btnNewGame').addEventListener('click', () => modal.classList.remove('hidden'));
            document.getElementById('btnCloseModal').addEventListener('click', () => modal.classList.add('hidden'));

            const pieceBtns = document.querySelectorAll('.piece-option-btn');
            pieceBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    pieceBtns.forEach(b => b.classList.remove('border-2', 'border-indigo-500', 'bg-indigo-950/50'));
                    btn.classList.add('border-2', 'border-indigo-500', 'bg-indigo-950/50');
                    selectedPieceCount = parseInt(btn.dataset.pieces);

                    const grid = calculateGrid(currentImage.width || 1200, currentImage.height || 800, selectedPieceCount);
                    document.getElementById('gridInfoText').innerText = `預計網格：${grid.cols} x ${grid.rows} 格 (${grid.actualCount} 片)`;
                });
            });

            document.getElementById('btnStartGame').addEventListener('click', () => {
                modal.classList.add('hidden');
                if (currentImage.complete) setupGame();
                else currentImage.onload = () => setupGame();
            });

            const hintOverlay = document.getElementById('hintOverlay');
            const opacitySliderContainer = document.getElementById('opacitySliderContainer');
            
            document.getElementById('btnTogglePreview').addEventListener('click', () => {
                const isHidden = hintOverlay.classList.contains('opacity-0');
                if (isHidden) {
                    hintOverlay.classList.remove('opacity-0');
                    opacitySliderContainer.classList.remove('hidden');
                } else {
                    hintOverlay.classList.add('opacity-0');
                    opacitySliderContainer.classList.add('hidden');
                }
            });

            document.getElementById('opacitySlider').addEventListener('input', (e) => {
                hintOverlay.style.opacity = e.target.value;
            });

            document.getElementById('btnEdgeOnly').addEventListener('click', (e) => {
                showEdgeOnly = !showEdgeOnly;
                e.currentTarget.classList.toggle('bg-indigo-600', showEdgeOnly);
            });

            document.getElementById('btnSortTray').addEventListener('click', () => {
                const pW = boardBounds.w / cols;
                const pH = boardBounds.h / rows;
                let edgeIdx = 0;
                let innerIdx = 0;

                groups.forEach(g => {
                    const isLocked = g.pieces.some(p => p.isLocked);
                    if (!isLocked) {
                        const first = g.pieces[0];
                        let targetX, targetY;

                        if (first.isEdge) {
                            targetX = boardBounds.x - pW * 2.2;
                            targetY = boardBounds.y + (edgeIdx * pH * 1.1) % (boardBounds.h * 1.2);
                            edgeIdx++;
                        } else {
                            targetX = boardBounds.x + boardBounds.w + pW * 1.2;
                            targetY = boardBounds.y + (innerIdx * pH * 1.1) % (boardBounds.h * 1.2);
                            innerIdx++;
                        }

                        const dx = targetX - first.x;
                        const dy = targetY - first.y;

                        g.pieces.forEach(p => {
                            p.x += dx;
                            p.y += dy;
                        });
                    }
                });
            });

            const updateZoomText = () => {
                document.getElementById('zoomText').innerText = `${Math.round(scale * 100)}%`;
            };

            document.getElementById('btnZoomIn').addEventListener('click', () => { scale = Math.min(scale * 1.25, 5.0); updateZoomText(); });
            document.getElementById('btnZoomOut').addEventListener('click', () => { scale = Math.max(scale / 1.25, 0.4); updateZoomText(); });
            document.getElementById('btnZoomReset').addEventListener('click', () => { scale = 1.0; panX = 0; panY = 0; updateZoomText(); });

            document.getElementById('btnScatter').addEventListener('click', () => {
                groups.forEach(g => {
                    if (!g.pieces.some(p => p.isLocked)) {
                        const pW = boardBounds.w / cols;
                        const rx = Math.random() < 0.5 
                            ? boardBounds.x - pW * 2.5 - Math.random() * 200 
                            : boardBounds.x + boardBounds.w + pW + Math.random() * 200;
                        const ry = boardBounds.y + Math.random() * (boardBounds.h);

                        const dx = rx - g.pieces[0].x;
                        const dy = ry - g.pieces[0].y;
                        g.pieces.forEach(p => { p.x += dx; p.y += dy; });
                    }
                });
            });

            // 拖放 (Drag and Drop) 資料夾或圖片
            const dropOverlay = document.getElementById('dragDropOverlay');
            window.addEventListener('dragover', (e) => { e.preventDefault(); dropOverlay.classList.remove('hidden'); });
            window.addEventListener('dragleave', (e) => {
                if (e.clientX <= 0 || e.clientY <= 0) dropOverlay.classList.add('hidden');
            });
            window.addEventListener('drop', (e) => {
                e.preventDefault();
                dropOverlay.classList.add('hidden');
                if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
                    processFileList(e.dataTransfer.files);
                }
            });

            canvas.addEventListener('mousedown', handlePointerDown);
            canvas.addEventListener('mousemove', handlePointerMove);
            window.addEventListener('mouseup', handlePointerUp);

            canvas.addEventListener('touchstart', (e) => { handlePointerDown(e); e.preventDefault(); }, { passive: false });
            canvas.addEventListener('touchmove', (e) => { handlePointerMove(e); e.preventDefault(); }, { passive: false });
            window.addEventListener('touchend', handlePointerUp);

            canvas.addEventListener('wheel', (e) => {
                e.preventDefault();
                const zoomFactor = e.deltaY < 0 ? 1.15 : 0.85;
                scale = Math.min(Math.max(scale * zoomFactor, 0.4), 5.0);
                updateZoomText();
            }, { passive: false });

            window.addEventListener('resize', () => {
                if (pieces.length > 0) setupGame();
            });
        }

        window.onload = () => {
            initUI();
            currentImage.onload = () => {
                setupGame();
                requestAnimationFrame(render);
            };
            currentImage.src = DEFAULT_SVG_DORY;
        };
    </script>
</body>
</html>
