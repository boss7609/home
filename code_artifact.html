<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>互動式線上拼圖大師 - 舒適版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Canvas Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
        body {
            font-family: 'Noto Sans TC', sans-serif;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }
        .canvas-container {
            cursor: grab;
        }
        .canvas-container:active {
            cursor: grabbing;
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.1);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(156, 163, 175, 0.5);
            border-radius: 4px;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 h-screen w-screen overflow-hidden flex flex-col transition-colors duration-300" id="appBody">

    <!-- 頂部導覽與工具列 -->
    <header class="bg-slate-800/90 backdrop-blur border-b border-slate-700 px-4 py-2 flex flex-wrap items-center justify-between gap-2 z-20 shrink-0">
        <div class="flex items-center space-x-3">
            <div class="bg-indigo-600 p-2 rounded-xl text-white shadow-lg shadow-indigo-500/30">
                <i class="fa-solid fa-puzzle-piece text-xl"></i>
            </div>
            <div>
                <h1 class="text-lg sm:text-xl font-bold tracking-wide bg-gradient-to-r from-indigo-400 to-purple-400 bg-clip-text text-transparent">
                    線上拼圖大師
                </h1>
                <span class="text-[10px] text-slate-400 block -mt-1">雙擊拼片可開啟高清晰放大鏡</span>
            </div>
        </div>

        <!-- 遊戲進度資訊 -->
        <div class="flex items-center space-x-4 bg-slate-900/60 px-3 py-1.5 rounded-lg border border-slate-700/50 text-sm">
            <div class="flex items-center space-x-1.5" title="計時器">
                <i class="fa-regular fa-clock text-indigo-400"></i>
                <span id="timerText" class="font-mono font-medium">00:00</span>
            </div>
            <div class="h-4 w-px bg-slate-700"></div>
            <div class="flex items-center space-x-1.5" title="完成進度">
                <i class="fa-solid fa-check-circle text-emerald-400"></i>
                <span id="progressText" class="font-mono font-medium">0 / 0</span>
            </div>
        </div>

        <!-- 控制按鈕群 -->
        <div class="flex items-center space-x-2">
            <button id="btnNewGame" class="bg-indigo-600 hover:bg-indigo-500 active:scale-95 text-white px-3 py-1.5 rounded-lg text-sm font-medium transition flex items-center space-x-1.5 shadow-md shadow-indigo-600/20">
                <i class="fa-solid fa-plus"></i>
                <span class="hidden sm:inline">新建拼圖</span>
            </button>
            <button id="btnTogglePreview" class="bg-slate-700 hover:bg-slate-600 active:scale-95 text-slate-200 px-3 py-1.5 rounded-lg text-sm font-medium transition flex items-center space-x-1.5">
                <i class="fa-regular fa-image"></i>
                <span class="hidden sm:inline">對照圖</span>
            </button>
            <button id="btnEdgeOnly" class="bg-slate-700 hover:bg-slate-600 active:scale-95 text-slate-200 px-3 py-1.5 rounded-lg text-sm font-medium transition flex items-center space-x-1.5" title="高亮外圍邊框片">
                <i class="fa-solid fa-border-all"></i>
                <span class="hidden sm:inline">篩選邊框</span>
            </button>
            <button id="btnSortTray" class="bg-amber-600/80 hover:bg-amber-500 active:scale-95 text-white px-3 py-1.5 rounded-lg text-sm font-medium transition flex items-center space-x-1.5" title="將未完成片排至兩側">
                <i class="fa-solid fa-boxes-stacked"></i>
                <span class="hidden sm:inline">自動整理</span>
            </button>
        </div>
    </header>

    <!-- 主要工作區 (Canvas) -->
    <main class="flex-1 relative overflow-hidden bg-slate-950 flex items-center justify-center" id="workspace">
        
        <!-- 背景對照圖片底稿 -->
        <div id="hintOverlay" class="absolute inset-0 pointer-events-none flex items-center justify-center opacity-0 transition-opacity duration-300 z-0">
            <img id="hintImage" class="max-w-full max-h-full object-contain filter brightness-90 shadow-2xl opacity-40" alt="Preview Hint">
        </div>

        <!-- 拼圖主繪圖區 -->
        <canvas id="puzzleCanvas" class="absolute inset-0 z-10 canvas-container"></canvas>

        <!-- 放大鏡預覽面板 (Magnifier Modal) -->
        <div id="magnifierModal" class="hidden absolute top-6 left-1/2 -translate-x-1/2 z-30 bg-slate-800/95 border border-indigo-500/50 p-3 rounded-2xl shadow-2xl backdrop-blur flex flex-col items-center space-y-2 pointer-events-none animate-bounce-short">
            <div class="text-xs text-indigo-300 font-bold flex items-center space-x-1">
                <i class="fa-solid fa-magnifying-glass"></i>
                <span>拼片圖案特寫預覽</span>
            </div>
            <canvas id="magnifierCanvas" class="rounded-xl border border-slate-600 shadow-inner" width="160" height="160"></canvas>
        </div>

        <!-- 縮放與畫布控制懸浮面板 -->
        <div class="absolute bottom-4 left-4 z-20 flex items-center bg-slate-800/90 backdrop-blur border border-slate-700/80 rounded-xl p-1.5 shadow-xl space-x-1">
            <button id="btnZoomIn" class="p-2 hover:bg-slate-700 rounded-lg text-slate-300 hover:text-white transition" title="放大 (最大500%)">
                <i class="fa-solid fa-magnifying-glass-plus"></i>
            </button>
            <button id="btnZoomReset" class="px-2 py-1 hover:bg-slate-700 rounded-lg text-slate-300 hover:text-white text-xs font-mono font-medium transition" title="重置視角與倍率" id="zoomText">
                100%
            </button>
            <button id="btnZoomOut" class="p-2 hover:bg-slate-700 rounded-lg text-slate-300 hover:text-white transition" title="縮小">
                <i class="fa-solid fa-magnifying-glass-minus"></i>
            </button>
            <div class="h-4 w-px bg-slate-700 my-auto"></div>
            <button id="btnScatter" class="p-2 hover:bg-slate-700 rounded-lg text-amber-400 hover:text-amber-300 transition" title="隨機散開剩餘拼片">
                <i class="fa-solid fa-shuffle"></i>
            </button>
        </div>

        <!-- 底圖透明度控制 -->
        <div id="opacitySliderContainer" class="hidden absolute top-4 right-4 z-20 bg-slate-800/90 backdrop-blur border border-slate-700 rounded-xl p-3 shadow-xl flex items-center space-x-3 text-xs">
            <span class="text-slate-400">底圖透明度</span>
            <input type="range" id="opacitySlider" min="0.1" max="0.9" step="0.05" value="0.4" class="w-24 accent-indigo-500">
        </div>
    </main>

    <!-- 新拼圖設定 Modal -->
    <div id="newGameModal" class="fixed inset-0 bg-black/75 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-slate-800 border border-slate-700 w-full max-w-xl rounded-2xl shadow-2xl p-6 overflow-y-auto max-h-[90vh]">
            <div class="flex justify-between items-center pb-4 border-b border-slate-700 mb-5">
                <h2 class="text-xl font-bold text-white flex items-center space-x-2">
                    <i class="fa-solid fa-sliders text-indigo-400"></i>
                    <span>建立新拼圖遊戲</span>
                </h2>
                <button id="btnCloseModal" class="text-slate-400 hover:text-white p-1 rounded-lg transition">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>

            <!-- 1. 選擇圖片 -->
            <div class="space-y-4 mb-6">
                <label class="block text-sm font-semibold text-slate-300">步驟 1：選擇圖片</label>
                
                <div class="relative border-2 border-dashed border-slate-600 hover:border-indigo-500 rounded-xl p-4 text-center cursor-pointer transition bg-slate-900/50 group">
                    <input type="file" id="imageInput" accept="image/*" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10">
                    <div class="flex flex-col items-center justify-center space-y-1">
                        <i class="fa-solid fa-cloud-arrow-up text-3xl text-slate-400 group-hover:text-indigo-400 transition"></i>
                        <span class="text-sm font-medium text-slate-300 group-hover:text-white">點擊或拖曳自訂圖片上傳</span>
                    </div>
                </div>

                <div>
                    <span class="text-xs text-slate-400 block mb-2">或選擇精選圖片：</span>
                    <div class="grid grid-cols-4 gap-2" id="sampleImagesGrid"></div>
                </div>
            </div>

            <!-- 2. 選擇拼圖片數 -->
            <div class="space-y-3 mb-8">
                <label class="block text-sm font-semibold text-slate-300">步驟 2：選擇目標片數 (預設 100 片最舒適)</label>
                <div class="grid grid-cols-3 sm:grid-cols-7 gap-2">
                    <button class="piece-option-btn p-2 rounded-xl border border-slate-700 bg-slate-900 hover:border-indigo-500 text-center transition" data-pieces="24">
                        <div class="text-base font-bold text-white">24</div>
                        <div class="text-[9px] text-slate-400">超大塊</div>
                    </button>
                    <button class="piece-option-btn p-2 rounded-xl border border-slate-700 bg-slate-900 hover:border-indigo-500 text-center transition" data-pieces="48">
                        <div class="text-base font-bold text-white">48</div>
                        <div class="text-[9px] text-slate-400">大塊</div>
                    </button>
                    <button class="piece-option-btn active-piece-btn p-2 rounded-xl border-2 border-indigo-500 bg-indigo-950/40 text-center transition relative overflow-hidden" data-pieces="100">
                        <div class="text-base font-bold text-indigo-300">100</div>
                        <div class="text-[9px] text-indigo-400">推薦舒適</div>
                    </button>
                    <button class="piece-option-btn p-2 rounded-xl border border-slate-700 bg-slate-900 hover:border-indigo-500 text-center transition" data-pieces="200">
                        <div class="text-base font-bold text-white">200</div>
                        <div class="text-[9px] text-slate-400">進階適中</div>
                    </button>
                    <button class="piece-option-btn p-2 rounded-xl border border-slate-700 bg-slate-900 hover:border-indigo-500 text-center transition opacity-80" data-pieces="500">
                        <div class="text-base font-bold text-amber-300">500</div>
                        <div class="text-[9px] text-amber-400">微縮挑戰</div>
                    </button>
                    <button class="piece-option-btn p-2 rounded-xl border border-slate-700 bg-slate-900 hover:border-indigo-500 text-center transition opacity-70" data-pieces="800">
                        <div class="text-base font-bold text-rose-300">800</div>
                        <div class="text-[9px] text-rose-400">密集高難</div>
                    </button>
                    <button class="piece-option-btn p-2 rounded-xl border border-slate-700 bg-slate-900 hover:border-indigo-500 text-center transition opacity-60" data-pieces="1000">
                        <div class="text-base font-bold text-purple-300">1000</div>
                        <div class="text-[9px] text-purple-400">極限大師</div>
                    </button>
                </div>
                <p id="gridInfoText" class="text-xs text-indigo-300 text-right mt-1 font-mono">預計網格：12 x 8 格 (96 片)</p>
            </div>

            <!-- 開始按鈕 -->
            <button id="btnStartGame" class="w-full bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white font-bold py-3 px-6 rounded-xl shadow-lg shadow-indigo-500/25 transition transform active:scale-98 flex items-center justify-center space-x-2 text-base">
                <i class="fa-solid fa-play"></i>
                <span>開始舒適拼圖</span>
            </button>
        </div>
    </div>

    <script>
        class SoundEffects {
            constructor() { this.ctx = null; }
            init() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); }
            playSnap() {
                this.init();
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(320, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(850, this.ctx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(); osc.stop(this.ctx.currentTime + 0.08);
            }
            playVictory() {
                this.init();
                if (!this.ctx) return;
                [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle'; osc.frequency.value = freq;
                    const st = this.ctx.currentTime + idx * 0.12;
                    gain.gain.setValueAtTime(0.2, st);
                    gain.gain.exponentialRampToValueAtTime(0.001, st + 0.4);
                    osc.connect(gain); gain.connect(this.ctx.destination);
                    osc.start(st); osc.stop(st + 0.4);
                });
            }
        }

        const soundFX = new SoundEffects();

        const SAMPLE_IMAGES = [
            { name: "預設圖片 (Dory)", url: "dory.jpg" },
            { name: "壯麗雪山", url: "https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=1200&q=80" },
            { name: "威尼斯運河", url: "https://images.unsplash.com/photo-1514890547357-a9ee288728e0?auto=format&fit=crop&w=1200&q=80" },
            { name: "夢幻熱帶雨林", url: "https://images.unsplash.com/photo-1511497584788-8767611136f6?auto=format&fit=crop&w=1200&q=80" }
        ];

        const canvas = document.getElementById('puzzleCanvas');
        const ctx = canvas.getContext('2d');

        let currentImage = new Image();
        let selectedPieceCount = 100; // 預設 100 片
        let cols = 12;
        let rows = 8;

        let pieces = [];
        let groups = [];
        let boardBounds = { x: 0, y: 0, w: 0, h: 0 };

        // Viewport Pan/Zoom
        let scale = 1.0;
        let panX = 0;
        let panY = 0;
        let isDraggingCanvas = false;
        let lastMouseX = 0;
        let lastMouseY = 0;

        let draggedGroup = null;
        let dragOffsetX = 0;
        let dragOffsetY = 0;

        let timerInterval = null;
        let secondsElapsed = 0;
        let isCompleted = false;
        let showEdgeOnly = false;

        let horizontalTabs = [];
        let verticalTabs = [];

        // 雙擊發動放大鏡與時間戳
        let lastClickTime = 0;

        // 計算最佳行列
        function calculateGrid(imgWidth, imgHeight, targetCount) {
            const aspect = imgWidth / imgHeight;
            let bestCols = Math.round(Math.sqrt(targetCount * aspect));
            let bestRows = Math.round(targetCount / bestCols);
            bestCols = Math.max(2, bestCols);
            bestRows = Math.max(2, bestRows);
            return { cols: bestCols, rows: bestRows, actualCount: bestCols * bestRows };
        }

        // 產生凹凸形狀邊界
        function generateTabs(cols, rows) {
            horizontalTabs = [];
            verticalTabs = [];
            for (let r = 0; r < rows; r++) {
                horizontalTabs[r] = [];
                for (let c = 0; c < cols - 1; c++) {
                    horizontalTabs[r][c] = Math.random() < 0.5 ? 1 : -1;
                }
            }
            for (let r = 0; r < rows - 1; r++) {
                verticalTabs[r] = [];
                for (let c = 0; c < cols; c++) {
                    verticalTabs[r][c] = Math.random() < 0.5 ? 1 : -1;
                }
            }
        }

        function createPuzzlePieces() {
            pieces = [];
            groups = [];

            const pieceW = boardBounds.w / cols;
            const pieceH = boardBounds.h / rows;

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const targetX = boardBounds.x + c * pieceW;
                    const targetY = boardBounds.y + r * pieceH;

                    const topTab = (r === 0) ? 0 : -verticalTabs[r - 1][c];
                    const rightTab = (c === cols - 1) ? 0 : horizontalTabs[r][c];
                    const bottomTab = (r === rows - 1) ? 0 : verticalTabs[r][c];
                    const leftTab = (c === 0) ? 0 : -horizontalTabs[r][c - 1];

                    const isEdge = (r === 0 || r === rows - 1 || c === 0 || c === cols - 1);

                    // 初始將拼圖散落在兩側與下方托盤，拉開距離避免擠壓
                    let randomX, randomY;
                    if (Math.random() < 0.5) {
                        randomX = Math.random() < 0.5 
                            ? boardBounds.x - pieceW * 2 - Math.random() * 250 
                            : boardBounds.x + boardBounds.w + pieceW + Math.random() * 250;
                        randomY = boardBounds.y + Math.random() * (boardBounds.h - pieceH);
                    } else {
                        randomX = boardBounds.x + Math.random() * (boardBounds.w - pieceW);
                        randomY = Math.random() < 0.5 
                            ? boardBounds.y - pieceH * 2 - Math.random() * 150 
                            : boardBounds.y + boardBounds.h + pieceH + Math.random() * 200;
                    }

                    const piece = {
                        id: r * cols + c,
                        row: r, col: c,
                        x: randomX, y: randomY,
                        targetX: targetX, targetY: targetY,
                        width: pieceW, height: pieceH,
                        tabs: { top: topTab, right: rightTab, bottom: bottomTab, left: leftTab },
                        isEdge: isEdge,
                        isLocked: false
                    };

                    pieces.push(piece);
                    groups.push({ id: piece.id, pieces: [piece] });
                }
            }
        }

        // 貝茲曲線繪製凸榫
        function drawPiecePath(ctx, x, y, w, h, tabs) {
            const tabSize = Math.min(w, h) * 0.23;
            ctx.beginPath();
            ctx.moveTo(x, y);

            // Top
            if (tabs.top === 0) ctx.lineTo(x + w, y);
            else {
                const dir = tabs.top;
                ctx.lineTo(x + w * 0.35, y);
                ctx.bezierCurveTo(x + w * 0.35, y - tabSize * dir, x + w * 0.4, y - tabSize * dir * 1.25, x + w * 0.5, y - tabSize * dir * 1.25);
                ctx.bezierCurveTo(x + w * 0.6, y - tabSize * dir * 1.25, x + w * 0.65, y - tabSize * dir, x + w * 0.65, y);
                ctx.lineTo(x + w, y);
            }

            // Right
            if (tabs.right === 0) ctx.lineTo(x + w, y + h);
            else {
                const dir = tabs.right;
                ctx.lineTo(x + w, y + h * 0.35);
                ctx.bezierCurveTo(x + w + tabSize * dir, y + h * 0.35, x + w + tabSize * dir * 1.25, y + h * 0.4, x + w + tabSize * dir * 1.25, y + h * 0.5);
                ctx.bezierCurveTo(x + w + tabSize * dir * 1.25, y + h * 0.6, x + w + tabSize * dir, y + h * 0.65, x + w, y + h * 0.65);
                ctx.lineTo(x + w, y + h);
            }

            // Bottom
            if (tabs.bottom === 0) ctx.lineTo(x, y + h);
            else {
                const dir = tabs.bottom;
                ctx.lineTo(x + w * 0.65, y + h);
                ctx.bezierCurveTo(x + w * 0.65, y + h + tabSize * dir, x + w * 0.6, y + h + tabSize * dir * 1.25, x + w * 0.5, y + h + tabSize * dir * 1.25);
                ctx.bezierCurveTo(x + w * 0.4, y + h + tabSize * dir * 1.25, x + w * 0.35, y + h + tabSize * dir, x + w * 0.35, y + h);
                ctx.lineTo(x, y + h);
            }

            // Left
            if (tabs.left === 0) ctx.lineTo(x, y);
            else {
                const dir = tabs.left;
                ctx.lineTo(x, y + h * 0.65);
                ctx.bezierCurveTo(x - tabSize * dir, y + h * 0.65, x - tabSize * dir * 1.25, y + h * 0.6, x - tabSize * dir * 1.25, y + h * 0.5);
                ctx.bezierCurveTo(x - tabSize * dir * 1.25, y + h * 0.4, x - tabSize * dir, y + h * 0.35, x, y + h * 0.35);
                ctx.lineTo(x, y);
            }
            ctx.closePath();
        }

        function render() {
            ctx.save();
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.translate(panX, panY);
            ctx.scale(scale, scale);

            // 1. 底板容器背景
            ctx.fillStyle = 'rgba(15, 23, 42, 0.75)';
            ctx.strokeStyle = 'rgba(99, 102, 241, 0.5)';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.roundRect(boardBounds.x - 12, boardBounds.y - 12, boardBounds.w + 24, boardBounds.h + 24, 20);
            ctx.fill();
            ctx.stroke();

            // 底板對齊輔助線
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.06)';
            ctx.lineWidth = 1;
            const pW = boardBounds.w / cols;
            const pH = boardBounds.h / rows;
            for (let c = 1; c < cols; c++) {
                ctx.beginPath();
                ctx.moveTo(boardBounds.x + c * pW, boardBounds.y);
                ctx.lineTo(boardBounds.x + c * pW, boardBounds.y + boardBounds.h);
                ctx.stroke();
            }
            for (let r = 1; r < rows; r++) {
                ctx.beginPath();
                ctx.moveTo(boardBounds.x, boardBounds.y + r * pH);
                ctx.lineTo(boardBounds.x + boardBounds.w, boardBounds.y + r * pH);
                ctx.stroke();
            }

            // 2. 渲染所有拼圖群組
            groups.forEach(group => {
                if (group !== draggedGroup) renderGroup(group);
            });

            if (draggedGroup) {
                renderGroup(draggedGroup, true);
            }

            ctx.restore();
            requestAnimationFrame(render);
        }

        function renderGroup(group, isDragging = false) {
            group.pieces.forEach(p => {
                if (showEdgeOnly && !p.isEdge && !p.isLocked) {
                    ctx.globalAlpha = 0.12;
                } else {
                    ctx.globalAlpha = 1.0;
                }

                ctx.save();
                drawPiecePath(ctx, p.x, p.y, p.width, p.height, p.tabs);

                if (isDragging) {
                    ctx.shadowColor = 'rgba(0, 0, 0, 0.6)';
                    ctx.shadowBlur = 18;
                    ctx.shadowOffsetY = 10;
                } else if (!p.isLocked) {
                    ctx.shadowColor = 'rgba(0, 0, 0, 0.35)';
                    ctx.shadowBlur = 6;
                    ctx.shadowOffsetY = 3;
                }

                ctx.save();
                ctx.clip();

                const srcX = (p.col / cols) * currentImage.width;
                const srcY = (p.row / rows) * currentImage.height;
                const srcW = currentImage.width / cols;
                const srcH = currentImage.height / rows;

                const bufferRatio = 0.35;
                const sx = Math.max(0, srcX - srcW * bufferRatio);
                const sy = Math.max(0, srcY - srcH * bufferRatio);
                const sw = Math.min(currentImage.width - sx, srcW * (1 + bufferRatio * 2));
                const sh = Math.min(currentImage.height - sy, srcH * (1 + bufferRatio * 2));

                const dx = p.x - p.width * bufferRatio;
                const dy = p.y - p.height * bufferRatio;
                const dw = p.width * (1 + bufferRatio * 2);
                const dh = p.height * (1 + bufferRatio * 2);

                ctx.drawImage(currentImage, sx, sy, sw, sh, dx, dy, dw, dh);
                ctx.restore();

                // 拼片邊界光影
                ctx.strokeStyle = p.isLocked 
                    ? 'rgba(255, 255, 255, 0.25)' 
                    : (isDragging ? 'rgba(129, 140, 248, 0.95)' : 'rgba(255, 255, 255, 0.45)');
                ctx.lineWidth = isDragging ? 3 : 1.8;
                ctx.stroke();

                ctx.restore();
            });
        }

        function getMousePos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: (clientX - rect.left - panX) / scale,
                y: (clientY - rect.top - panY) / scale
            };
        }

        function findPieceAt(pos) {
            for (let i = groups.length - 1; i >= 0; i--) {
                const group = groups[i];
                for (const p of group.pieces) {
                    if (pos.x >= p.x && pos.x <= p.x + p.width &&
                        pos.y >= p.y && pos.y <= p.y + p.height) {
                        return { piece: p, group: group };
                    }
                }
            }
            return null;
        }

        // 雙擊展示細節特寫放大鏡
        function showPieceMagnifier(piece) {
            const modal = document.getElementById('magnifierModal');
            const magCanvas = document.getElementById('magnifierCanvas');
            const mctx = magCanvas.getContext('2d');

            mctx.clearRect(0, 0, magCanvas.width, magCanvas.height);

            const srcX = (piece.col / cols) * currentImage.width;
            const srcY = (piece.row / rows) * currentImage.height;
            const srcW = currentImage.width / cols;
            const srcH = currentImage.height / rows;

            mctx.drawImage(currentImage, srcX, srcY, srcW, srcH, 0, 0, magCanvas.width, magCanvas.height);
            modal.classList.remove('hidden');

            setTimeout(() => { modal.classList.add('hidden'); }, 2200);
        }

        function handlePointerDown(e) {
            if (isCompleted) return;

            const now = Date.now();
            const pos = getMousePos(e);
            const found = findPieceAt(pos);

            // 觸發雙擊檢測
            if (now - lastClickTime < 300 && found) {
                showPieceMagnifier(found.piece);
            }
            lastClickTime = now;

            if (found && !found.piece.isLocked) {
                draggedGroup = found.group;
                dragOffsetX = pos.x;
                dragOffsetY = pos.y;

                const idx = groups.indexOf(draggedGroup);
                if (idx > -1) {
                    groups.splice(idx, 1);
                    groups.push(draggedGroup);
                }
            } else {
                isDraggingCanvas = true;
                lastMouseX = e.touches ? e.touches[0].clientX : e.clientX;
                lastMouseY = e.touches ? e.touches[0].clientY : e.clientY;
            }
        }

        function handlePointerMove(e) {
            if (draggedGroup) {
                const pos = getMousePos(e);
                const dx = pos.x - dragOffsetX;
                const dy = pos.y - dragOffsetY;

                draggedGroup.pieces.forEach(p => {
                    p.x += dx;
                    p.y += dy;
                });

                dragOffsetX = pos.x;
                dragOffsetY = pos.y;
            } else if (isDraggingCanvas) {
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;

                panX += clientX - lastMouseX;
                panY += clientY - lastMouseY;

                lastMouseX = clientX;
                lastMouseY = clientY;
            }
        }

        function handlePointerUp() {
            if (draggedGroup) {
                checkSnap(draggedGroup);
                draggedGroup = null;
            }
            isDraggingCanvas = false;
        }

        function checkSnap(group) {
            const snapThreshold = Math.min(boardBounds.w / cols, boardBounds.h / rows) * 0.4;
            let snapped = false;

            // 吸附底板
            for (const p of group.pieces) {
                const distToTarget = Math.hypot(p.x - p.targetX, p.y - p.targetY);

                if (distToTarget < snapThreshold) {
                    const correctionX = p.targetX - p.x;
                    const correctionY = p.targetY - p.y;

                    group.pieces.forEach(piece => {
                        piece.x += correctionX;
                        piece.y += correctionY;
                        piece.isLocked = true;
                    });

                    snapped = true;
                    soundFX.playSnap();
                    break;
                }
            }

            // 吸附相鄰拼片
            if (!snapped) {
                for (const otherGroup of groups) {
                    if (otherGroup === group) continue;

                    let shouldMerge = false;
                    let mergeOffsetX = 0;
                    let mergeOffsetY = 0;

                    for (const p1 of group.pieces) {
                        for (const p2 of otherGroup.pieces) {
                            const isNeighbor = Math.abs(p1.row - p2.row) + Math.abs(p1.col - p2.col) === 1;

                            if (isNeighbor) {
                                const expectedDx = p1.targetX - p2.targetX;
                                const expectedDy = p1.targetY - p2.targetY;
                                const actualDx = p1.x - p2.x;
                                const actualDy = p1.y - p2.y;

                                if (Math.hypot(actualDx - expectedDx, actualDy - expectedDy) < snapThreshold) {
                                    shouldMerge = true;
                                    mergeOffsetX = (p2.x + expectedDx) - p1.x;
                                    mergeOffsetY = (p2.y + expectedDy) - p1.y;
                                    break;
                                }
                            }
                        }
                        if (shouldMerge) break;
                    }

                    if (shouldMerge) {
                        group.pieces.forEach(p => {
                            p.x += mergeOffsetX;
                            p.y += mergeOffsetY;
                            otherGroup.pieces.push(p);
                        });

                        const groupIdx = groups.indexOf(group);
                        if (groupIdx > -1) groups.splice(groupIdx, 1);

                        soundFX.playSnap();
                        break;
                    }
                }
            }

            updateProgress();
        }

        function updateProgress() {
            const lockedCount = pieces.filter(p => p.isLocked).length;
            document.getElementById('progressText').innerText = `${lockedCount} / ${pieces.length}`;

            if (lockedCount === pieces.length && pieces.length > 0 && !isCompleted) {
                isCompleted = true;
                clearInterval(timerInterval);
                soundFX.playVictory();

                confetti({ particleCount: 180, spread: 90, origin: { y: 0.6 } });

                setTimeout(() => {
                    alert(`🎉 恭喜完成！\n花費時間：${formatTime(secondsElapsed)}\n挑戰片數：${pieces.length} 片`);
                }, 300);
            }
        }

        function startTimer() {
            clearInterval(timerInterval);
            secondsElapsed = 0;
            document.getElementById('timerText').innerText = "00:00";
            timerInterval = setInterval(() => {
                secondsElapsed++;
                document.getElementById('timerText').innerText = formatTime(secondsElapsed);
            }, 1000);
        }

        function formatTime(sec) {
            const m = Math.floor(sec / 60).toString().padStart(2, '0');
            const s = (sec % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        function setupGame() {
            const container = document.getElementById('workspace');
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;

            // 提高基礎版面大小（佔據畫布 75% 寬度）
            const maxW = canvas.width * 0.75;
            const maxH = canvas.height * 0.75;
            const imgAspect = currentImage.width / currentImage.height;

            let boardW = maxW;
            let boardH = maxW / imgAspect;

            if (boardH > maxH) {
                boardH = maxH;
                boardW = maxH * imgAspect;
            }

            boardBounds = {
                x: (canvas.width - boardW) / 2,
                y: (canvas.height - boardH) / 2,
                w: boardW,
                h: boardH
            };

            const hintImg = document.getElementById('hintImage');
            hintImg.src = currentImage.src;
            hintImg.style.width = `${boardW}px`;
            hintImg.style.height = `${boardH}px`;

            const grid = calculateGrid(currentImage.width, currentImage.height, selectedPieceCount);
            cols = grid.cols;
            rows = grid.rows;

            generateTabs(cols, rows);
            createPuzzlePieces();

            isCompleted = false;
            scale = 1.0;
            panX = 0;
            panY = 0;

            updateProgress();
            startTimer();
        }

        function initUI() {
            const modal = document.getElementById('newGameModal');

            document.getElementById('btnNewGame').addEventListener('click', () => modal.classList.remove('hidden'));
            document.getElementById('btnCloseModal').addEventListener('click', () => modal.classList.add('hidden'));

            const sampleGrid = document.getElementById('sampleImagesGrid');
            sampleGrid.innerHTML = '';
            SAMPLE_IMAGES.forEach((item, idx) => {
                const imgDiv = document.createElement('div');
                imgDiv.className = `relative rounded-xl overflow-hidden cursor-pointer border-2 transition ${idx === 0 ? 'border-indigo-500 scale-105' : 'border-slate-700 hover:border-slate-500'}`;
                imgDiv.innerHTML = `
                    <img src="${item.url}" onerror="this.onerror=null; this.src='https://placehold.co/1200x800/1e293b/6366f1?text=Dory+Image';" class="w-full h-16 object-cover" alt="${item.name}">
                    <span class="absolute bottom-0 inset-x-0 bg-black/60 text-[10px] text-center text-white truncate px-1 py-0.5">${item.name}</span>
                `;
                imgDiv.addEventListener('click', () => {
                    document.querySelectorAll('#sampleImagesGrid > div').forEach(d => d.className = 'relative rounded-xl overflow-hidden cursor-pointer border-2 border-slate-700 hover:border-slate-500');
                    imgDiv.className = 'relative rounded-xl overflow-hidden cursor-pointer border-2 border-indigo-500 scale-105';
                    currentImage.src = item.url;
                });
                sampleGrid.appendChild(imgDiv);
            });

            currentImage.crossOrigin = "Anonymous";
            currentImage.onerror = () => {
                currentImage.src = "https://placehold.co/1200x800/1e293b/6366f1?text=dory.jpg";
            };
            currentImage.src = "dory.jpg";

            document.getElementById('imageInput').addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (evt) => {
                        currentImage.src = evt.target.result;
                    };
                    reader.readAsDataURL(file);
                }
            });

            const pieceBtns = document.querySelectorAll('.piece-option-btn');
            pieceBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    pieceBtns.forEach(b => b.classList.remove('border-2', 'border-indigo-500', 'bg-indigo-950/40'));
                    btn.classList.add('border-2', 'border-indigo-500', 'bg-indigo-950/40');
                    selectedPieceCount = parseInt(btn.dataset.pieces);

                    const grid = calculateGrid(currentImage.width || 1200, currentImage.height || 800, selectedPieceCount);
                    document.getElementById('gridInfoText').innerText = `預計網格：${grid.cols} x ${grid.rows} 格 (${grid.actualCount} 片)`;
                });
            });

            document.getElementById('btnStartGame').addEventListener('click', () => {
                modal.classList.add('hidden');
                if (currentImage.complete) setupGame();
                else currentImage.onload = () => setupGame();
            });

            const hintOverlay = document.getElementById('hintOverlay');
            const opacitySliderContainer = document.getElementById('opacitySliderContainer');
            
            document.getElementById('btnTogglePreview').addEventListener('click', () => {
                const isHidden = hintOverlay.classList.contains('opacity-0');
                if (isHidden) {
                    hintOverlay.classList.remove('opacity-0');
                    opacitySliderContainer.classList.remove('hidden');
                } else {
                    hintOverlay.classList.add('opacity-0');
                    opacitySliderContainer.classList.add('hidden');
                }
            });

            document.getElementById('opacitySlider').addEventListener('input', (e) => {
                hintOverlay.style.opacity = e.target.value;
            });

            document.getElementById('btnEdgeOnly').addEventListener('click', (e) => {
                showEdgeOnly = !showEdgeOnly;
                e.currentTarget.classList.toggle('bg-indigo-600', showEdgeOnly);
            });

            // 自動整理托盤（按邊框片與內部片歸類兩側）
            document.getElementById('btnSortTray').addEventListener('click', () => {
                const pW = boardBounds.w / cols;
                const pH = boardBounds.h / rows;
                let edgeIdx = 0;
                let innerIdx = 0;

                groups.forEach(g => {
                    const isLocked = g.pieces.some(p => p.isLocked);
                    if (!isLocked) {
                        const first = g.pieces[0];
                        let targetX, targetY;

                        if (first.isEdge) {
                            targetX = boardBounds.x - pW * 2.2;
                            targetY = boardBounds.y + (edgeIdx * pH * 1.1) % (boardBounds.h * 1.2);
                            edgeIdx++;
                        } else {
                            targetX = boardBounds.x + boardBounds.w + pW * 1.2;
                            targetY = boardBounds.y + (innerIdx * pH * 1.1) % (boardBounds.h * 1.2);
                            innerIdx++;
                        }

                        const dx = targetX - first.x;
                        const dy = targetY - first.y;

                        g.pieces.forEach(p => {
                            p.x += dx;
                            p.y += dy;
                        });
                    }
                });
            });

            // 放大縮小按鈕 (最大至 500%)
            const updateZoomText = () => {
                document.getElementById('zoomText').innerText = `${Math.round(scale * 100)}%`;
            };

            document.getElementById('btnZoomIn').addEventListener('click', () => {
                scale = Math.min(scale * 1.25, 5.0);
                updateZoomText();
            });
            document.getElementById('btnZoomOut').addEventListener('click', () => {
                scale = Math.max(scale / 1.25, 0.4);
                updateZoomText();
            });
            document.getElementById('btnZoomReset').addEventListener('click', () => {
                scale = 1.0; panX = 0; panY = 0;
                updateZoomText();
            });

            document.getElementById('btnScatter').addEventListener('click', () => {
                groups.forEach(g => {
                    if (!g.pieces.some(p => p.isLocked)) {
                        const pW = boardBounds.w / cols;
                        const rx = Math.random() < 0.5 
                            ? boardBounds.x - pW * 2.5 - Math.random() * 200 
                            : boardBounds.x + boardBounds.w + pW + Math.random() * 200;
                        const ry = boardBounds.y + Math.random() * (boardBounds.h);

                        const dx = rx - g.pieces[0].x;
                        const dy = ry - g.pieces[0].y;
                        g.pieces.forEach(p => { p.x += dx; p.y += dy; });
                    }
                });
            });

            canvas.addEventListener('mousedown', handlePointerDown);
            canvas.addEventListener('mousemove', handlePointerMove);
            window.addEventListener('mouseup', handlePointerUp);

            canvas.addEventListener('touchstart', (e) => { handlePointerDown(e); e.preventDefault(); }, { passive: false });
            canvas.addEventListener('touchmove', (e) => { handlePointerMove(e); e.preventDefault(); }, { passive: false });
            window.addEventListener('touchend', handlePointerUp);

            canvas.addEventListener('wheel', (e) => {
                e.preventDefault();
                const zoomFactor = e.deltaY < 0 ? 1.15 : 0.85;
                scale = Math.min(Math.max(scale * zoomFactor, 0.4), 5.0);
                updateZoomText();
            }, { passive: false });

            window.addEventListener('resize', () => {
                if (pieces.length > 0) setupGame();
            });
        }

        window.onload = () => {
            initUI();
            currentImage.onload = () => {
                setupGame();
                requestAnimationFrame(render);
            };
        };
    </script>
</body>
</html>
