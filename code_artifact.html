<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>dory 線上拼圖大師</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
        body {
            font-family: 'Noto Sans TC', sans-serif;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }
        .canvas-container {
            cursor: grab;
        }
        .canvas-container:active {
            cursor: grabbing;
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 h-screen w-screen overflow-hidden flex flex-col relative" id="appBody">

    <!-- 頂部控制列 -->
    <header class="bg-slate-900/95 backdrop-blur border-b border-slate-800 px-4 py-2 flex flex-wrap items-center justify-between gap-2 z-30 shrink-0">
        <div class="flex items-center space-x-3">
            <div class="bg-indigo-600 p-2 rounded-xl text-white shadow-lg shadow-indigo-600/30">
                <i class="fa-solid fa-puzzle-piece text-xl"></i>
            </div>
            <div>
                <h1 class="text-base sm:text-lg font-bold tracking-wide text-indigo-300 flex items-center gap-2">
                    <span>拼圖大師</span>
                    <span id="currentImgName" class="text-xs bg-slate-800 text-slate-400 px-2 py-0.5 rounded-full font-normal max-w-[180px] truncate inline-block">讀取中...</span>
                </h1>
                <p class="text-[10px] text-slate-400 -mt-0.5">自動讀取 home/dory 資料夾圖片</p>
            </div>
        </div>

        <!-- 圖片切換與載入區域 -->
        <div class="flex items-center space-x-2">
            <button id="btnRandomImg" class="bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white px-3.5 py-1.5 rounded-xl text-xs sm:text-sm font-semibold transition flex items-center space-x-2 shadow-lg shadow-indigo-500/25 active:scale-95">
                <i class="fa-solid fa-shuffle text-amber-300"></i>
                <span>🎲 隨機切換圖片</span>
            </button>

            <button id="btnPrevImg" class="bg-slate-800 hover:bg-slate-700 text-slate-300 p-2 rounded-xl text-xs transition disabled:opacity-30" title="上一張圖片">
                <i class="fa-solid fa-chevron-left"></i>
            </button>
            <button id="btnNextImg" class="bg-slate-800 hover:bg-slate-700 text-slate-300 p-2 rounded-xl text-xs transition disabled:opacity-30" title="下一張圖片">
                <i class="fa-solid fa-chevron-right"></i>
            </button>
        </div>

        <!-- 遊戲計時與進度 -->
        <div class="flex items-center space-x-3 bg-slate-900/80 px-3 py-1.5 rounded-xl border border-slate-800 text-xs">
            <div class="flex items-center space-x-1.5">
                <i class="fa-regular fa-clock text-indigo-400"></i>
                <span id="timerText" class="font-mono font-bold">00:00</span>
            </div>
            <div class="h-3.5 w-px bg-slate-700"></div>
            <div class="flex items-center space-x-1.5">
                <i class="fa-solid fa-check-circle text-emerald-400"></i>
                <span id="progressText" class="font-mono font-bold">0 / 0</span>
            </div>
        </div>

        <!-- 遊戲操作工具 -->
        <div class="flex items-center space-x-2">
            <button id="btnNewGame" class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-1.5 rounded-xl text-xs font-medium transition flex items-center space-x-1.5">
                <i class="fa-solid fa-sliders text-indigo-400"></i>
                <span class="hidden sm:inline">設定</span>
            </button>
            <button id="btnTogglePreview" class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-1.5 rounded-xl text-xs font-medium transition flex items-center space-x-1.5">
                <i class="fa-regular fa-image"></i>
                <span class="hidden sm:inline">對照圖</span>
            </button>
            <button id="btnEdgeOnly" class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-1.5 rounded-xl text-xs font-medium transition" title="高亮外圍邊框片">
                <i class="fa-solid fa-border-all"></i>
            </button>
            <button id="btnSortTray" class="bg-amber-600/80 hover:bg-amber-500 text-white px-3 py-1.5 rounded-xl text-xs font-medium transition" title="歸位至兩側托盤">
                <i class="fa-solid fa-boxes-stacked"></i>
            </button>
        </div>
    </header>

    <!-- 已載入圖片畫廊條 (縮圖抽屜) -->
    <div id="galleryBar" class="bg-slate-900/90 border-b border-slate-800 px-4 py-2 flex items-center space-x-3 overflow-x-auto no-scrollbar z-20 shrink-0">
        <span class="text-xs text-slate-400 font-semibold shrink-0">home/dory 圖庫 (<span id="galleryCount">0</span>)：</span>
        <div id="galleryThumbnails" class="flex items-center space-x-2"></div>
    </div>

    <!-- Canvas 主繪圖區域 -->
    <main class="flex-1 relative overflow-hidden bg-slate-950 flex items-center justify-center" id="workspace">
        
        <!-- 背景透明底稿對照 -->
        <div id="hintOverlay" class="absolute inset-0 pointer-events-none flex items-center justify-center opacity-0 transition-opacity duration-300 z-0">
            <img id="hintImage" class="max-w-full max-h-full object-contain filter brightness-90 shadow-2xl opacity-40" alt="Preview Hint">
        </div>

        <!-- 拼圖 Canvas -->
        <canvas id="puzzleCanvas" class="absolute inset-0 z-10 canvas-container"></canvas>

        <!-- 雙擊放大鏡面板 -->
        <div id="magnifierModal" class="hidden absolute top-6 left-1/2 -translate-x-1/2 z-30 bg-slate-900/90 border border-indigo-500/50 p-2.5 rounded-2xl shadow-2xl backdrop-blur flex flex-col items-center space-y-1.5 pointer-events-none">
            <div class="text-[11px] text-indigo-300 font-bold flex items-center space-x-1">
                <i class="fa-solid fa-magnifying-glass"></i>
                <span>雙擊拼片特寫預覽</span>
            </div>
            <canvas id="magnifierCanvas" class="rounded-xl border border-slate-700 shadow-inner" width="160" height="160"></canvas>
        </div>

        <!-- 畫布平移縮放控制項 -->
        <div class="absolute bottom-4 left-4 z-20 flex items-center bg-slate-900/90 backdrop-blur border border-slate-800 rounded-xl p-1.5 shadow-xl space-x-1">
            <button id="btnZoomIn" class="p-2 hover:bg-slate-800 rounded-lg text-slate-300 hover:text-white transition" title="放大">
                <i class="fa-solid fa-magnifying-glass-plus"></i>
            </button>
            <button id="btnZoomReset" class="px-2 py-1 hover:bg-slate-800 rounded-lg text-slate-300 hover:text-white text-xs font-mono font-bold transition">
                <span id="zoomText">100%</span>
            </button>
            <button id="btnZoomOut" class="p-2 hover:bg-slate-800 rounded-lg text-slate-300 hover:text-white transition" title="縮小">
                <i class="fa-solid fa-magnifying-glass-minus"></i>
            </button>
            <div class="h-4 w-px bg-slate-800 my-auto"></div>
            <button id="btnScatter" class="p-2 hover:bg-slate-800 rounded-lg text-amber-400 hover:text-amber-300 transition" title="分散剩餘拼片">
                <i class="fa-solid fa-shuffle"></i>
            </button>
        </div>

        <!-- 底圖透明度調節控制器 -->
        <div id="opacitySliderContainer" class="hidden absolute top-4 right-4 z-20 bg-slate-900/90 backdrop-blur border border-slate-800 rounded-xl p-3 shadow-xl flex items-center space-x-3 text-xs">
            <span class="text-slate-400 font-medium">底圖透明度</span>
            <input type="range" id="opacitySlider" min="0.1" max="0.9" step="0.05" value="0.4" class="w-24 accent-indigo-500 cursor-pointer">
        </div>
    </main>

    <!-- 拼圖設定面板 Modal -->
    <div id="newGameModal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-lg rounded-2xl shadow-2xl p-6 overflow-y-auto max-h-[90vh]">
            <div class="flex justify-between items-center pb-4 border-b border-slate-800 mb-5">
                <h2 class="text-lg font-bold text-white flex items-center space-x-2">
                    <i class="fa-solid fa-sliders text-indigo-400"></i>
                    <span>拼圖難度與片數設定</span>
                </h2>
                <button id="btnCloseModal" class="text-slate-400 hover:text-white p-1 rounded-lg transition">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>

            <!-- 片數選擇 -->
            <div class="space-y-3 mb-6">
                <label class="block text-sm font-semibold text-slate-300">選擇拼圖片數 (預設 100 片)</label>
                <div class="grid grid-cols-3 sm:grid-cols-7 gap-2">
                    <button class="piece-option-btn p-2 rounded-xl border border-slate-800 bg-slate-950 hover:border-indigo-500 text-center transition" data-pieces="24">
                        <div class="text-base font-bold text-white">24</div>
                        <div class="text-[9px] text-slate-400">特大</div>
                    </button>
                    <button class="piece-option-btn p-2 rounded-xl border border-slate-800 bg-slate-950 hover:border-indigo-500 text-center transition" data-pieces="48">
                        <div class="text-base font-bold text-white">48</div>
                        <div class="text-[9px] text-slate-400">大塊</div>
                    </button>
                    <button class="piece-option-btn active-piece-btn p-2 rounded-xl border-2 border-indigo-500 bg-indigo-950/50 text-center transition" data-pieces="100">
                        <div class="text-base font-bold text-indigo-300">100</div>
                        <div class="text-[9px] text-indigo-400">推薦</div>
                    </button>
                    <button class="piece-option-btn p-2 rounded-xl border border-slate-800 bg-slate-950 hover:border-indigo-500 text-center transition" data-pieces="200">
                        <div class="text-base font-bold text-white">200</div>
                        <div class="text-[9px] text-slate-400">適中</div>
                    </button>
                    <button class="piece-option-btn p-2 rounded-xl border border-slate-800 bg-slate-950 hover:border-indigo-500 text-center transition" data-pieces="500">
                        <div class="text-base font-bold text-amber-300">500</div>
                        <div class="text-[9px] text-amber-400">微縮</div>
                    </button>
                    <button class="piece-option-btn p-2 rounded-xl border border-slate-800 bg-slate-950 hover:border-indigo-500 text-center transition" data-pieces="800">
                        <div class="text-base font-bold text-rose-300">800</div>
                        <div class="text-[9px] text-rose-400">高難</div>
                    </button>
                    <button class="piece-option-btn p-2 rounded-xl border border-slate-800 bg-slate-950 hover:border-indigo-500 text-center transition" data-pieces="1000">
                        <div class="text-base font-bold text-purple-300">1000</div>
                        <div class="text-[9px] text-purple-400">大師</div>
                    </button>
                </div>
                <p id="gridInfoText" class="text-xs text-indigo-300 text-right mt-1 font-mono">預計網格：12 x 8 格 (96 片)</p>
            </div>

            <!-- 開始按鈕 -->
            <button id="btnStartGame" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 px-6 rounded-xl shadow-lg shadow-indigo-600/30 transition active:scale-98 flex items-center justify-center space-x-2 text-sm">
                <i class="fa-solid fa-play"></i>
                <span>開始遊戲</span>
            </button>
        </div>
    </div>

    <!-- JavaScript 遊戲核心與自動讀取 home/dory 資料夾邏輯 -->
    <script>
        // 音效處理
        class SoundEffects {
            constructor() { this.ctx = null; }
            init() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); }
            playSnap() {
                this.init();
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(320, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(850, this.ctx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(); osc.stop(this.ctx.currentTime + 0.08);
            }
            playVictory() {
                this.init();
                if (!this.ctx) return;
                [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle'; osc.frequency.value = freq;
                    const st = this.ctx.currentTime + idx * 0.12;
                    gain.gain.setValueAtTime(0.2, st);
                    gain.gain.exponentialRampToValueAtTime(0.001, st + 0.4);
                    osc.connect(gain); gain.connect(this.ctx.destination);
                    osc.start(st); osc.stop(st + 0.4);
                });
            }
        }

        const soundFX = new SoundEffects();

        // 圖片自動偵測設定：更新為 home/dory 路徑
        const FOLDER_NAME = 'home/dory';
        const DEFAULT_IMAGE_URL = 'https://boss7609.github.io/home/dory/IMG_9536.jpeg';

        let loadedImages = []; // { name, url }
        let currentImageIndex = 0;
        let currentImage = new Image();

        const canvas = document.getElementById('puzzleCanvas');
        const ctx = canvas.getContext('2d');

        let selectedPieceCount = 100;
        let cols = 12;
        let rows = 8;

        let pieces = [];
        let groups = [];
        let boardBounds = { x: 0, y: 0, w: 0, h: 0 };

        let scale = 1.0;
        let panX = 0;
        let panY = 0;
        let isDraggingCanvas = false;
        let lastMouseX = 0;
        let lastMouseY = 0;

        let draggedGroup = null;
        let dragOffsetX = 0;
        let dragOffsetY = 0;

        let timerInterval = null;
        let secondsElapsed = 0;
        let isCompleted = false;
        let showEdgeOnly = false;

        let horizontalTabs = [];
        let verticalTabs = [];
        let lastClickTime = 0;

        // 自動檢測並讀取 home/dory 資料夾中的圖片檔
        async function autoDetectDoryImages() {
            const possibleNames = [];
            
            // 1. 優先加入明確提供的照片檔名
            possibleNames.push('IMG_9536.jpeg', 'IMG_9536.jpg', 'IMG_9536.JPG');

            // 2. 自動嘗試附近常見的相機編號（IMG_9500 ~ IMG_9560）
            for (let i = 9500; i <= 9560; i++) {
                possibleNames.push(`IMG_${i}.jpeg`, `IMG_${i}.jpg`, `IMG_${i}.JPG`);
            }

            // 3. 傳統數字命名備用 (1~30)
            for (let i = 1; i <= 30; i++) {
                possibleNames.push(`${i}.jpg`, `${i}.jpeg`, `dory${i}.jpg`);
            }

            const validImages = [];

            const checkImageExists = (url) => {
                return new Promise((resolve) => {
                    const img = new Image();
                    img.onload = () => resolve(true);
                    img.onerror = () => resolve(false);
                    img.src = url;
                });
            };

            // 併行檢測所有潛在圖片路徑
            const checks = possibleNames.map(async (fileName) => {
                const path = `./${FOLDER_NAME}/${fileName}`;
                const exists = await checkImageExists(path);
                if (exists) {
                    validImages.push({ name: fileName, url: path });
                }
            });

            await Promise.all(checks);

            // 去除重複項目
            const uniqueImages = Array.from(new Set(validImages.map(a => a.url)))
                .map(url => validImages.find(a => a.url === url));

            if (uniqueImages.length > 0) {
                loadedImages = uniqueImages;
                currentImageIndex = 0;
                renderGalleryDrawer();
                switchImage(0);
            } else {
                // 若找不到相對路徑（例如本地直接開啟 HTML 時），預設載入指定的 GitHub Pages 網址
                loadedImages = [{ name: 'IMG_9536.jpeg', url: DEFAULT_IMAGE_URL }];
                currentImageIndex = 0;
                renderGalleryDrawer();
                switchImage(0);
            }
        }

        function renderGalleryDrawer() {
            const drawer = document.getElementById('galleryBar');
            const thumbsContainer = document.getElementById('galleryThumbnails');
            const countText = document.getElementById('galleryCount');

            drawer.classList.remove('hidden');
            countText.innerText = loadedImages.length;
            thumbsContainer.innerHTML = '';

            loadedImages.forEach((item, idx) => {
                const thumb = document.createElement('div');
                thumb.className = `w-12 h-12 rounded-lg overflow-hidden border-2 cursor-pointer shrink-0 transition ${idx === currentImageIndex ? 'border-indigo-500 scale-105 shadow-md shadow-indigo-500/30' : 'border-slate-800 opacity-60 hover:opacity-100'}`;
                thumb.innerHTML = `<img src="${item.url}" class="w-full h-full object-cover" title="${item.name}">`;
                thumb.addEventListener('click', () => switchImage(idx));
                thumbsContainer.appendChild(thumb);
            });

            document.getElementById('btnPrevImg').disabled = loadedImages.length <= 1;
            document.getElementById('btnNextImg').disabled = loadedImages.length <= 1;
        }

        function switchImage(index) {
            if (loadedImages.length === 0) return;
            currentImageIndex = (index + loadedImages.length) % loadedImages.length;
            const target = loadedImages[currentImageIndex];

            document.getElementById('currentImgName').innerText = target.name;
            renderGalleryDrawer();

            currentImage = new Image();
            currentImage.crossOrigin = "Anonymous";
            currentImage.onload = () => { setupGame(); };
            currentImage.src = target.url;
        }

        function calculateGrid(imgWidth, imgHeight, targetCount) {
            const aspect = imgWidth / imgHeight;
            let bestCols = Math.round(Math.sqrt(targetCount * aspect));
            let bestRows = Math.round(targetCount / bestCols);
            bestCols = Math.max(2, bestCols);
            bestRows = Math.max(2, bestRows);
            return { cols: bestCols, rows: bestRows, actualCount: bestCols * bestRows };
        }

        function generateTabs(cols, rows) {
            horizontalTabs = [];
            verticalTabs = [];
            for (let r = 0; r < rows; r++) {
                horizontalTabs[r] = [];
                for (let c = 0; c < cols - 1; c++) {
                    horizontalTabs[r][c] = Math.random() < 0.5 ? 1 : -1;
                }
            }
            for (let r = 0; r < rows - 1; r++) {
                verticalTabs[r] = [];
                for (let c = 0; c < cols; c++) {
                    verticalTabs[r][c] = Math.random() < 0.5 ? 1 : -1;
                }
            }
        }

        function createPuzzlePieces() {
            pieces = [];
            groups = [];

            const pieceW = boardBounds.w / cols;
            const pieceH = boardBounds.h / rows;

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const targetX = boardBounds.x + c * pieceW;
                    const targetY = boardBounds.y + r * pieceH;

                    const topTab = (r === 0) ? 0 : -verticalTabs[r - 1][c];
                    const rightTab = (c === cols - 1) ? 0 : horizontalTabs[r][c];
                    const bottomTab = (r === rows - 1) ? 0 : verticalTabs[r][c];
                    const leftTab = (c === 0) ? 0 : -horizontalTabs[r][c - 1];

                    const isEdge = (r === 0 || r === rows - 1 || c === 0 || c === cols - 1);

                    let randomX, randomY;
                    if (Math.random() < 0.5) {
                        randomX = Math.random() < 0.5 
                            ? boardBounds.x - pieceW * 2 - Math.random() * 250 
                            : boardBounds.x + boardBounds.w + pieceW + Math.random() * 250;
                        randomY = boardBounds.y + Math.random() * (boardBounds.h - pieceH);
                    } else {
                        randomX = boardBounds.x + Math.random() * (boardBounds.w - pieceW);
                        randomY = Math.random() < 0.5 
                            ? boardBounds.y - pieceH * 2 - Math.random() * 150 
                            : boardBounds.y + boardBounds.h + pieceH + Math.random() * 200;
                    }

                    const piece = {
                        id: r * cols + c,
                        row: r, col: c,
                        x: randomX, y: randomY,
                        targetX: targetX, targetY: targetY,
                        width: pieceW, height: pieceH,
                        tabs: { top: topTab, right: rightTab, bottom: bottomTab, left: leftTab },
                        isEdge: isEdge,
                        isLocked: false
                    };

                    pieces.push(piece);
                    groups.push({ id: piece.id, pieces: [piece] });
                }
            }
        }

        function drawPiecePath(ctx, x, y, w, h, tabs) {
            const tabSize = Math.min(w, h) * 0.22;
            ctx.beginPath();
            ctx.moveTo(x, y);

            // Top
            if (tabs.top === 0) ctx.lineTo(x + w, y);
            else {
                const dir = tabs.top;
                ctx.lineTo(x + w * 0.35, y);
                ctx.bezierCurveTo(x + w * 0.35, y - tabSize * dir, x + w * 0.4, y - tabSize * dir * 1.25, x + w * 0.5, y - tabSize * dir * 1.25);
                ctx.bezierCurveTo(x + w * 0.6, y - tabSize * dir * 1.25, x + w * 0.65, y - tabSize * dir, x + w * 0.65, y);
                ctx.lineTo(x + w, y);
            }

            // Right
            if (tabs.right === 0) ctx.lineTo(x + w, y + h);
            else {
                const dir = tabs.right;
                ctx.lineTo(x + w, y + h * 0.35);
                ctx.bezierCurveTo(x + w + tabSize * dir, y + h * 0.35, x + w + tabSize * dir * 1.25, y + h * 0.4, x + w + tabSize * dir * 1.25, y + h * 0.5);
                ctx.bezierCurveTo(x + w + tabSize * dir * 1.25, y + h * 0.6, x + w + tabSize * dir, y + h * 0.65, x + w, y + h * 0.65);
                ctx.lineTo(x + w, y + h);
            }

            // Bottom
            if (tabs.bottom === 0) ctx.lineTo(x, y + h);
            else {
                const dir = tabs.bottom;
                ctx.lineTo(x + w * 0.65, y + h);
                ctx.bezierCurveTo(x + w * 0.65, y + h + tabSize * dir, x + w * 0.6, y + h + tabSize * dir * 1.25, x + w * 0.5, y + h + tabSize * dir * 1.25);
                ctx.bezierCurveTo(x + w * 0.4, y + h + tabSize * dir * 1.25, x + w * 0.35, y + h + tabSize * dir, x + w * 0.35, y + h);
                ctx.lineTo(x, y + h);
            }

            // Left
            if (tabs.left === 0) ctx.lineTo(x, y);
            else {
                const dir = tabs.left;
                ctx.lineTo(x, y + h * 0.65);
                ctx.bezierCurveTo(x - tabSize * dir, y + h * 0.65, x - tabSize * dir * 1.25, y + h * 0.6, x - tabSize * dir * 1.25, y + h * 0.5);
                ctx.bezierCurveTo(x - tabSize * dir * 1.25, y + h * 0.4, x - tabSize * dir, y + h * 0.35, x, y + h * 0.35);
                ctx.lineTo(x, y);
            }
            ctx.closePath();
        }

        function render() {
            ctx.save();
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.translate(panX, panY);
            ctx.scale(scale, scale);

            // 1. 底板外框與底色
            ctx.fillStyle = 'rgba(15, 23, 42, 0.75)';
            ctx.strokeStyle = 'rgba(99, 102, 241, 0.5)';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.roundRect(boardBounds.x - 12, boardBounds.y - 12, boardBounds.w + 24, boardBounds.h + 24, 20);
            ctx.fill();
            ctx.stroke();

            // 對齊線
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
            ctx.lineWidth = 1;
            const pW = boardBounds.w / cols;
            const pH = boardBounds.h / rows;
            for (let c = 1; c < cols; c++) {
                ctx.beginPath();
                ctx.moveTo(boardBounds.x + c * pW, boardBounds.y);
                ctx.lineTo(boardBounds.x + c * pW, boardBounds.y + boardBounds.h);
                ctx.stroke();
            }
            for (let r = 1; r < rows; r++) {
                ctx.beginPath();
                ctx.moveTo(boardBounds.x, boardBounds.y + r * pH);
                ctx.lineTo(boardBounds.x + boardBounds.w, boardBounds.y + r * pH);
                ctx.stroke();
            }

            // 2. 繪製拼圖群組
            groups.forEach(group => {
                if (group !== draggedGroup) renderGroup(group);
            });

            if (draggedGroup) {
                renderGroup(draggedGroup, true);
            }

            ctx.restore();
            requestAnimationFrame(render);
        }

        function renderGroup(group, isDragging = false) {
            group.pieces.forEach(p => {
                if (showEdgeOnly && !p.isEdge && !p.isLocked) {
                    ctx.globalAlpha = 0.12;
                } else {
                    ctx.globalAlpha = 1.0;
                }

                ctx.save();
                drawPiecePath(ctx, p.x, p.y, p.width, p.height, p.tabs);

                if (isDragging) {
                    ctx.shadowColor = 'rgba(0, 0, 0, 0.6)';
                    ctx.shadowBlur = 18;
                    ctx.shadowOffsetY = 10;
                } else if (!p.isLocked) {
                    ctx.shadowColor = 'rgba(0, 0, 0, 0.35)';
                    ctx.shadowBlur = 6;
                    ctx.shadowOffsetY = 3;
                }

                ctx.save();
                ctx.clip();

                const tabPadding = Math.min(p.width, p.height) * 0.35;
                const renderDx = p.x - tabPadding;
                const renderDy = p.y - tabPadding;

                const scaleX = currentImage.width / boardBounds.w;
                const scaleY = currentImage.height / boardBounds.h;

                const renderSx = (p.col * p.width - tabPadding) * scaleX;
                const renderSy = (p.row * p.height - tabPadding) * scaleY;
                const renderSw = (p.width + tabPadding * 2) * scaleX;
                const renderSh = (p.height + tabPadding * 2) * scaleY;

                const safeSx = Math.max(0, renderSx);
                const safeSy = Math.max(0, renderSy);
                const safeSw = Math.min(currentImage.width - safeSx, renderSw - (safeSx - renderSx));
                const safeSh = Math.min(currentImage.height - safeSy, renderSh - (safeSy - renderSy));

                const adjustedDx = renderDx + (safeSx - renderSx) / scaleX;
                const adjustedDy = renderDy + (safeSy - renderSy) / scaleY;
                const adjustedDw = safeSw / scaleX;
                const adjustedDh = safeSh / scaleY;

                ctx.drawImage(
                    currentImage,
                    safeSx, safeSy, safeSw, safeSh,
                    adjustedDx, adjustedDy, adjustedDw, adjustedDh
                );

                ctx.restore();

                ctx.strokeStyle = p.isLocked 
                    ? 'rgba(255, 255, 255, 0.25)' 
                    : (isDragging ? 'rgba(129, 140, 248, 0.95)' : 'rgba(255, 255, 255, 0.45)');
                ctx.lineWidth = isDragging ? 3 : 1.8;
                ctx.stroke();

                ctx.restore();
            });
        }

        function getMousePos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: (clientX - rect.left - panX) / scale,
                y: (clientY - rect.top - panY) / scale
            };
        }

        function findPieceAt(pos) {
            for (let i = groups.length - 1; i >= 0; i--) {
                const group = groups[i];
                for (const p of group.pieces) {
                    if (pos.x >= p.x && pos.x <= p.x + p.width &&
                        pos.y >= p.y && pos.y <= p.y + p.height) {
                        return { piece: p, group: group };
                    }
                }
            }
            return null;
        }

        function showPieceMagnifier(piece) {
            const modal = document.getElementById('magnifierModal');
            const magCanvas = document.getElementById('magnifierCanvas');
            const mctx = magCanvas.getContext('2d');

            mctx.clearRect(0, 0, magCanvas.width, magCanvas.height);

            const srcX = (piece.col / cols) * currentImage.width;
            const srcY = (piece.row / rows) * currentImage.height;
            const srcW = currentImage.width / cols;
            const srcH = currentImage.height / rows;

            mctx.drawImage(currentImage, srcX, srcY, srcW, srcH, 0, 0, magCanvas.width, magCanvas.height);
            modal.classList.remove('hidden');

            setTimeout(() => { modal.classList.add('hidden'); }, 2200);
        }

        function handlePointerDown(e) {
            if (isCompleted) return;

            const now = Date.now();
            const pos = getMousePos(e);
            const found = findPieceAt(pos);

            if (now - lastClickTime < 300 && found) {
                showPieceMagnifier(found.piece);
                lastClickTime = now;
                return;
            }
            lastClickTime = now;

            if (found && !found.piece.isLocked) {
                draggedGroup = found.group;
                dragOffsetX = pos.x;
                dragOffsetY = pos.y;

                groups.splice(groups.indexOf(draggedGroup), 1);
                groups.push(draggedGroup);
            } else {
                isDraggingCanvas = true;
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                lastMouseX = clientX;
                lastMouseY = clientY;
            }
        }

        function handlePointerMove(e) {
            if (draggedGroup) {
                const pos = getMousePos(e);
                const dx = pos.x - dragOffsetX;
                const dy = pos.y - dragOffsetY;

                draggedGroup.pieces.forEach(p => {
                    p.x += dx;
                    p.y += dy;
                });

                dragOffsetX = pos.x;
                dragOffsetY = pos.y;
            } else if (isDraggingCanvas) {
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                panX += clientX - lastMouseX;
                panY += clientY - lastMouseY;
                lastMouseX = clientX;
                lastMouseY = clientY;
            }
        }

        function handlePointerUp() {
            if (draggedGroup) {
                checkSnapAndMerge(draggedGroup);
                draggedGroup = null;
                checkVictoryCondition();
            }
            isDraggingCanvas = false;
        }

        function checkSnapAndMerge(group) {
            const snapThreshold = Math.min(boardBounds.w / cols, boardBounds.h / rows) * 0.35;
            let merged = false;

            // 1. 吸附到正確位置 (底板)
            group.pieces.forEach(p => {
                const dist = Math.hypot(p.x - p.targetX, p.y - p.targetY);
                if (dist < snapThreshold) {
                    const dx = p.targetX - p.x;
                    const dy = p.targetY - p.y;

                    group.pieces.forEach(gp => {
                        gp.x += dx;
                        gp.y += dy;
                        gp.isLocked = true;
                    });

                    soundFX.playSnap();
                    merged = true;
                }
            });

            // 2. 群組間相鄰吸附
            if (!merged) {
                for (let i = 0; i < groups.length; i++) {
                    const otherGroup = groups[i];
                    if (otherGroup === group) continue;

                    let shouldMerge = false;
                    let snapDx = 0, snapDy = 0;

                    for (const p1 of group.pieces) {
                        for (const p2 of otherGroup.pieces) {
                            if (Math.abs(p1.row - p2.row) + Math.abs(p1.col - p2.col) === 1) {
                                const expectedDx = p1.targetX - p2.targetX;
                                const expectedDy = p1.targetY - p2.targetY;
                                const currentDx = p1.x - p2.x;
                                const currentDy = p1.y - p2.y;

                                if (Math.hypot(currentDx - expectedDx, currentDy - expectedDy) < snapThreshold) {
                                    shouldMerge = true;
                                    snapDx = (p2.x + expectedDx) - p1.x;
                                    snapDy = (p2.y + expectedDy) - p1.y;
                                    break;
                                }
                            }
                        }
                        if (shouldMerge) break;
                    }

                    if (shouldMerge) {
                        group.pieces.forEach(gp => {
                            gp.x += snapDx;
                            gp.y += snapDy;
                            if (otherGroup.pieces[0].isLocked) gp.isLocked = true;
                            otherGroup.pieces.push(gp);
                        });

                        groups.splice(groups.indexOf(group), 1);
                        soundFX.playSnap();
                        break;
                    }
                }
            }

            updateProgressUI();
        }

        function updateProgressUI() {
            const lockedCount = pieces.filter(p => p.isLocked).length;
            document.getElementById('progressText').innerText = `${lockedCount} / ${pieces.length}`;
        }

        function checkVictoryCondition() {
            const allLocked = pieces.every(p => p.isLocked);
            if (allLocked && !isCompleted) {
                isCompleted = true;
                clearInterval(timerInterval);
                soundFX.playVictory();

                confetti({
                    particleCount: 120,
                    spread: 80,
                    origin: { y: 0.6 }
                });

                setTimeout(() => {
                    alert(`🎉 恭喜完成拼圖！總用時：${document.getElementById('timerText').innerText}`);
                }, 300);
            }
        }

        function sortTrayPieces() {
            const pieceW = boardBounds.w / cols;
            const pieceH = boardBounds.h / rows;
            let leftCount = 0;
            let rightCount = 0;

            groups.forEach(group => {
                if (group.pieces.some(p => p.isLocked)) return;

                const isLeft = (leftCount <= rightCount);
                const colIdx = isLeft ? Math.floor(leftCount / 12) : Math.floor(rightCount / 12);
                const rowIdx = isLeft ? (leftCount % 12) : (rightCount % 12);

                const startX = isLeft 
                    ? boardBounds.x - pieceW * 2.2 - colIdx * (pieceW * 1.1)
                    : boardBounds.x + boardBounds.w + pieceW * 1.2 + colIdx * (pieceW * 1.1);
                const startY = boardBounds.y + rowIdx * (pieceH * 0.85);

                const refP = group.pieces[0];
                const dx = startX - refP.x;
                const dy = startY - refP.y;

                group.pieces.forEach(p => {
                    p.x += dx;
                    p.y += dy;
                });

                if (isLeft) leftCount++; else rightCount++;
            });
        }

        function scatterPieces() {
            const pieceW = boardBounds.w / cols;
            const pieceH = boardBounds.h / rows;

            groups.forEach(group => {
                if (group.pieces.some(p => p.isLocked)) return;

                const randomX = boardBounds.x + (Math.random() - 0.5) * (boardBounds.w * 1.8);
                const randomY = boardBounds.y + (Math.random() - 0.5) * (boardBounds.h * 1.8);

                const refP = group.pieces[0];
                const dx = randomX - refP.x;
                const dy = randomY - refP.y;

                group.pieces.forEach(p => {
                    p.x += dx;
                    p.y += dy;
                });
            });
        }

        function setupGame() {
            clearInterval(timerInterval);
            secondsElapsed = 0;
            isCompleted = false;
            document.getElementById('timerText').innerText = "00:00";

            timerInterval = setInterval(() => {
                secondsElapsed++;
                const mins = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
                const secs = String(secondsElapsed % 60).padStart(2, '0');
                document.getElementById('timerText').innerText = `${mins}:${secs}`;
            }, 1000);

            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;

            const grid = calculateGrid(currentImage.width, currentImage.height, selectedPieceCount);
            cols = grid.cols;
            rows = grid.rows;

            const margin = 120;
            const maxW = canvas.width - margin * 2;
            const maxH = canvas.height - margin * 2;

            let bw = maxW;
            let bh = bw * (currentImage.height / currentImage.width);

            if (bh > maxH) {
                bh = maxH;
                bw = bh * (currentImage.width / currentImage.height);
            }

            boardBounds = {
                x: (canvas.width - bw) / 2,
                y: (canvas.height - bh) / 2,
                w: bw,
                h: bh
            };

            document.getElementById('hintImage').src = currentImage.src;

            generateTabs(cols, rows);
            createPuzzlePieces();
            updateProgressUI();
        }

        // 初始化與事件監聽
        window.addEventListener('load', () => {
            // 自動偵測 home/dory 資料夾圖片
            autoDetectDoryImages();

            // Canvas 操作事件
            canvas.addEventListener('mousedown', handlePointerDown);
            window.addEventListener('mousemove', handlePointerMove);
            window.addEventListener('mouseup', handlePointerUp);

            canvas.addEventListener('touchstart', handlePointerDown, { passive: true });
            window.addEventListener('touchmove', handlePointerMove, { passive: true });
            window.addEventListener('touchend', handlePointerUp);

            canvas.addEventListener('wheel', (e) => {
                e.preventDefault();
                const zoomFactor = e.deltaY < 0 ? 1.1 : 0.9;
                scale = Math.min(Math.max(0.4, scale * zoomFactor), 3.0);
                document.getElementById('zoomText').innerText = `${Math.round(scale * 100)}%`;
            }, { passive: false });

            // 控制按鈕事件
            document.getElementById('btnRandomImg').addEventListener('click', () => {
                if (loadedImages.length === 0) return;
                const nextIdx = Math.floor(Math.random() * loadedImages.length);
                switchImage(nextIdx);
            });

            document.getElementById('btnPrevImg').addEventListener('click', () => switchImage(currentImageIndex - 1));
            document.getElementById('btnNextImg').addEventListener('click', () => switchImage(currentImageIndex + 1));

            document.getElementById('btnNewGame').addEventListener('click', () => {
                document.getElementById('newGameModal').classList.remove('hidden');
            });
            document.getElementById('btnCloseModal').addEventListener('click', () => {
                document.getElementById('newGameModal').classList.add('hidden');
            });

            document.querySelectorAll('.piece-option-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.piece-option-btn').forEach(b => {
                        b.classList.remove('active-piece-btn', 'border-2', 'border-indigo-500', 'bg-indigo-950/50');
                        b.classList.add('border', 'border-slate-800', 'bg-slate-950');
                    });
                    const target = e.currentTarget;
                    target.classList.add('active-piece-btn', 'border-2', 'border-indigo-500', 'bg-indigo-950/50');
                    selectedPieceCount = parseInt(target.getAttribute('data-pieces'));

                    if (currentImage.width) {
                        const grid = calculateGrid(currentImage.width, currentImage.height, selectedPieceCount);
                        document.getElementById('gridInfoText').innerText = `預計網格：${grid.cols} x ${grid.rows} 格 (${grid.actualCount} 片)`;
                    }
                });
            });

            document.getElementById('btnStartGame').addEventListener('click', () => {
                document.getElementById('newGameModal').classList.add('hidden');
                setupGame();
            });

            document.getElementById('btnTogglePreview').addEventListener('click', () => {
                const hint = document.getElementById('hintOverlay');
                const slider = document.getElementById('opacitySliderContainer');
                const isHidden = hint.classList.contains('opacity-0');

                if (isHidden) {
                    hint.classList.remove('opacity-0');
                    slider.classList.remove('hidden');
                } else {
                    hint.classList.add('opacity-0');
                    slider.classList.add('hidden');
                }
            });

            document.getElementById('opacitySlider').addEventListener('input', (e) => {
                document.getElementById('hintImage').style.opacity = e.target.value;
            });

            document.getElementById('btnEdgeOnly').addEventListener('click', () => {
                showEdgeOnly = !showEdgeOnly;
                document.getElementById('btnEdgeOnly').classList.toggle('bg-indigo-600', showEdgeOnly);
            });

            document.getElementById('btnSortTray').addEventListener('click', sortTrayPieces);
            document.getElementById('btnScatter').addEventListener('click', scatterPieces);

            document.getElementById('btnZoomIn').addEventListener('click', () => {
                scale = Math.min(3.0, scale * 1.15);
                document.getElementById('zoomText').innerText = `${Math.round(scale * 100)}%`;
            });
            document.getElementById('btnZoomOut').addEventListener('click', () => {
                scale = Math.max(0.4, scale * 0.85);
                document.getElementById('zoomText').innerText = `${Math.round(scale * 100)}%`;
            });
            document.getElementById('btnZoomReset').addEventListener('click', () => {
                scale = 1.0; panX = 0; panY = 0;
                document.getElementById('zoomText').innerText = `100%`;
            });

            window.addEventListener('resize', () => {
                if (currentImage.src) setupGame();
            });

            // 啟動主渲染循環
            requestAnimationFrame(render);
        });
    </script>
</body>
</html>
